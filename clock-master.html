<html lang="th">
<head>

<title>จัดการลงเวลา - อึ้งลักเส็ง</title>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px;color:#1f2937;background:#f3f4f6}
button,input,select{font:inherit}
.hidden{display:none!important}
.muted{color:#6b7280}
/* ล็อกอิน */
#login{max-width:380px;margin:12vh auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.12)}
#login h1{margin:0 0 4px;font-size:22px}
#login label{display:block;margin:14px 0 4px;font-weight:600}
#login input{width:100%;padding:10px;border:1px solid #9ca3af;border-radius:8px}
.err{color:#b91c1c;margin:10px 0 0;min-height:1.2em}
.notice{color:#92400e;background:#fef3c7;padding:8px 10px;border-radius:8px;margin-top:10px}
/* โครงหน้า */
#app{display:flex;min-height:100vh}
#side{width:210px;background:#14532d;color:#fff;padding:14px 10px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
#side h2{font-size:17px;margin:4px 8px 12px}
#side button.tab{background:transparent;border:0;color:#fff;text-align:left;padding:11px 12px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
#side button.tab.on{background:#16a34a}
#side button.tab:hover{background:#15803d}
.badge{background:#dc2626;color:#fff;border-radius:999px;padding:0 8px;font-size:13px;min-width:22px;text-align:center}
#side .sp{flex:1}
#side .who{font-size:13px;opacity:.8;margin:6px 8px;word-break:break-all}
#side button.lock{background:#fff;color:#14532d;border:0;border-radius:8px;padding:10px;cursor:pointer;font-weight:700}
#main{flex:1;padding:20px;min-width:0}
#idlewarn{position:fixed;top:0;left:0;right:0;background:#f59e0b;color:#111;text-align:center;padding:10px;z-index:3000;font-weight:700}
h3{margin:0 0 12px}
.card{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.1);margin-bottom:14px}
.btn{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:#16a34a;color:#fff;font-weight:600}
.btn:disabled{background:#d1d5db;color:#6b7280;cursor:not-allowed}
.btn.red{background:#dc2626}.btn.gray{background:#6b7280}.btn.blue{background:#2563eb}.btn.orange{background:#ea580c}
.btn.small{padding:5px 10px;font-size:14px}
input[type=text],input[type=number],input[type=password],input[type=time],input[type=date],select{padding:7px 9px;border:1px solid #9ca3af;border-radius:6px;background:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
.row label{display:flex;flex-direction:column;font-size:14px;gap:3px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:9px 10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:middle}

.person .nm{font-weight:700;font-size:18px}
.person .tx{font-size:15px;margin-top:2px}
.person.s-none{background:#e5e7eb;color:#4b5563}
.person.s-work{background:#dcfce7}
.person.s-break{background:#dbeafe}
.person.s-break.over{background:#fed7aa}

.tag.late{background:#fff7ed;border-color:#f97316;color:#c2410c}
.tag.bad{background:#fef2f2;border-color:#dc2626;color:#b91c1c}

.req{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.req .ua{font-size:12px;color:#6b7280;word-break:break-all;max-width:520px}
.map{height:300px;border-radius:8px;margin:8px 0}
/* modal */
#modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:2000}

/* เฟส 2 */

.rvwrap{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:14px;align-items:start}
#rvSide{position:sticky;top:10px}

.editor{background:#f9fafb;border:1px solid #d1d5db}
.struck input,.struck select{text-decoration:line-through;opacity:.55}
.inl{padding:3px 5px}
.warn{background:#fff7ed;color:#c2410c;font-weight:700}
.rprow:hover{background:#f0fdf4}
.rptotal td{background:#f3f4f6}

@media(max-width:900px){.rvwrap{grid-template-columns:1fr}#rvSide{position:static}}
@media(max-width:700px){#app{flex-direction:column}#side{width:auto;flex-direction:row;flex-wrap:wrap}}

<body>

<section id="login" class="hidden">
  <h1>จัดการลงเวลา</h1>
  <div class="muted">ร้านอึ้งลักเส็ง · สำหรับเจ้าของร้าน</div>
  <form id="loginForm" autocomplete="on">
    <label for="em">อีเมล</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">รหัสผ่าน</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" id="loginBtn" type="submit" style="width:100%;margin-top:6px;padding:11px">เข้าสู่ระบบ</button>
  </form>
  <div id="cfgMissing" class="notice hidden">ยังไม่ได้ตั้งค่า Firebase ที่ด้านบนของไฟล์นี้ (FIREBASE_CONFIG) ดูวิธีทำใน README</div>
</section>

<div id="app" class="hidden">
  <nav id="side">
    <h2>ลงเวลา · เจ้าของ</h2>

  <main id="main">
    <div id="calwarn" class="hidden"></div>
    <section id="p-today"></section>
    <section id="p-pending" class="hidden"></section>
    <section id="p-times" class="hidden"></section>
    <section id="p-report" class="hidden"></section>
    <section id="p-staff" class="hidden"></section>
    <section id="p-branches" class="hidden"></section>
  </main>
</div>
<div id="idlewarn" class="hidden">จะออกจากระบบอัตโนมัติใน 1 นาที เพราะไม่ได้ใช้งาน (ขยับเมาส์เพื่อใช้งานต่อ)</div>
<div id="modalbg" class="hidden"><div id="modal"></div></div>

<script type="module">
// โหมดเดโม (?demo=1): ใช้ฐานข้อมูลจำลองในเครื่องแทน Firebase ดู demo.html ถ้าไม่มี ?demo=1 โค้ดเดโมไม่ถูกโหลดและใช้ Firebase SDK ตามเดิม
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const FBM = DEMO ? await import('./demo/firebase-demo.mjs') : null;
const [{ initializeApp }, { getAuth, setPersistence, browserSessionPersistence, signInWithEmailAndPassword, signOut, onAuthStateChanged, connectAuthEmulator }, { getDatabase, ref, onValue, get, update, set, remove, push, serverTimestamp, connectDatabaseEmulator, query, orderByKey, orderByChild, startAt, endAt, limitToLast, equalTo }] = FBM ? [FBM, FBM, FBM] : await Promise.all([
  import('https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js'),
  import('https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js'),
  import('https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js')
]);

/* ====== ตั้งค่า Firebase (เจ้าของใส่เอง ดู README ข้อ 7) ====== */
const FIREBASE_CONFIG = {
  apiKey: 'PASTE_HERE',
  authDomain: 'PASTE_HERE',
  databaseURL: 'PASTE_HERE',
  projectId: 'PASTE_HERE',
  appId: 'PASTE_HERE'
};

const EMU = ['localhost', '127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).get('emu') === '1';
const CONFIG_MISSING = !EMU && !DEMO && Object.values(FIREBASE_CONFIG).some((v) => !v || v === 'PASTE_HERE');
const IDLE_MS = 30 * 60 * 1000;

const $ = (s, r = document) => r.querySelector(s);
/** สร้าง element ด้วย textContent เท่านั้น (ห้ามใช้ innerHTML กับข้อมูลจาก DB) */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k.startsWith('.')) e[k.slice(1)] = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };

// ==== SHARED CORE v3 BEGIN — ต้องเหมือนกันทุกตัวอักษรใน clock.html และ clock-master.html (tests/core.test.mjs ตรวจ) ====
// วิธีแก้: แก้ใน clock-master.html ก่อน คัดลอกทั้งบล็อกไป clock.html แล้วรัน cd tests && npm run test:core
// ฟังก์ชันล้วน: ไม่อ้าง DOM / Firebase / Intl / ตัวแปรนอกบล็อก (ส่งค่าเข้ามาทาง ctx)
const MIN_MS = 60000, DAY_MS = 86400000, BKK_OFFSET_MS = 25200000;
const STALE_MS = 16 * 3600 * 1000;            // ค่าเดียวกับ 57600000 ใน database.rules.json
const TYPE_ORDER = { in: 0, break_start: 1, break_end: 2, out: 3 };
const HHMM_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
const isExcluded = (l) => !!l && (l.voided === true || l.review === 'rejected');
const bkkDateOf = (ms) => new Date(ms + BKK_OFFSET_MS).toISOString().slice(0, 10);
const hhmmOf = (ms) => new Date(ms + BKK_OFFSET_MS).toISOString().slice(11, 16);
const tsOf = (d, hhmm, plusDay) => Date.parse(d + 'T' + hhmm + ':00+07:00') + (plusDay ? DAY_MS : 0);
const addDaysKey = (d, n) => bkkDateOf(Date.parse(d + 'T12:00:00+07:00') + n * DAY_MS);
const floorMin = (ts) => Math.floor(ts / MIN_MS);
const logsToList = (obj) => Object.entries(obj || {}).filter(([, l]) => l && typeof l === 'object').map(([id, l]) => ({ ...l, id }))
  .sort((a, b) => (a.ts || 0) - (b.ts || 0) || (TYPE_ORDER[a.type] ?? 9) - (TYPE_ORDER[b.type] ?? 9));

/** summarize v3: segment เริ่มด้วย in; ไม่นับ voided/rejected; ค่าระดับบนเท่า v2 (flags นับเฉพาะที่ยังไม่ตรวจ) */
function summarize(logsObj) {
  const ev = logsToList(logsObj).filter((l) => typeof l.ts === 'number' && !isExcluded(l));
  const segments = [], flags = new Set(); let cur = null;
  for (const e of ev) {
    if (e.flag && !e.review) flags.add(e.flag);
    if (e.type === 'in') { cur = { n: segments.length + 1, inTs: e.ts, inLog: e, outTs: null, outLog: null, breakMs: 0, breaks: [], openBreak: null, openBreakAtOut: false, orphanOut: false }; segments.push(cur); continue; }
    if (!cur) continue;
    if (e.type === 'break_start') { if (cur.openBreak == null) cur.openBreak = e.ts; }
    else if (e.type === 'break_end') { if (cur.openBreak != null) { cur.breakMs += e.ts - cur.openBreak; cur.breaks.push([cur.openBreak, e.ts]); cur.openBreak = null; } }
    else if (e.type === 'out') { if (cur.outTs != null) { cur.orphanOut = true; continue; } if (cur.openBreak != null) cur.openBreakAtOut = true; cur.outTs = e.ts; cur.outLog = e; }
  }
  const last = segments[segments.length - 1] || null;
  const netMs = segments.filter((g) => g.outTs != null).reduce((a, g) => a + (g.outTs - g.inTs - g.breakMs), 0);
  return { ev, segments, flags, inTs: segments[0] ? segments[0].inTs : null, outTs: last ? last.outTs : null, breakMs: segments.reduce((a, g) => a + g.breakMs, 0), openBreak: last ? last.openBreak : null, netMs };
}

/**
 * สรุป 1 คน x 1 วันทำงาน (นาทีเต็มตามเวลาที่แสดง) ใช้ทุกหน้าจอ/รายงาน/CSV
 * ctx = { shiftStart, shiftEnd, graceMin, homeBranchId, breakLimitFor(branchId), state, now }
 */
function dayReport(d, logsObj, ctx) {
  const c = ctx || {};
  const sum = summarize(logsObj);
  const st = c.state || null;
  const now = typeof c.now === 'number' ? c.now : 0;
  const nSeg = sum.segments.length;
  const segs = sum.segments.map((g, i) => {
    const closed = g.outTs != null;
    const breakMin = g.breaks.reduce((a, b) => a + (floorMin(b[1]) - floorMin(b[0])), 0);
    let status = 'closed';
    if (!closed) {
      const live = i === nSeg - 1 && !!st && st.workDate === d && (st.status === 'working' || st.status === 'on_break') && typeof st.inAt === 'number' && now - st.inAt <= STALE_MS;
      status = live ? 'live' : 'missing';
    }
    return {
      n: g.n, inTs: g.inTs, outTs: g.outTs, inPlus: bkkDateOf(g.inTs) > d, outPlus: closed && bkkDateOf(g.outTs) > d,
      breakMin, netMin: closed ? floorMin(g.outTs) - floorMin(g.inTs) - breakMin : null, status,
      branchId: (g.inLog && g.inLog.branchId) || null, openBreakAtOut: g.openBreakAtOut, orphanOut: g.orphanOut
    };
  });
  const closedSegs = segs.filter((g) => g.status === 'closed');
  const netMin = closedSegs.reduce((a, g) => a + g.netMin, 0);
  const breakMin = closedSegs.reduce((a, g) => a + g.breakMin, 0);
  const breakMinAll = segs.reduce((a, g) => a + g.breakMin, 0);
  const missing = segs.some((g) => g.status === 'missing'), live = segs.some((g) => g.status === 'live');
  const openStatus = missing ? 'missing' : live ? 'live' : null;
  const firstInTs = nSeg ? segs[0].inTs : null;
  const lastOutTs = nSeg ? segs[nSeg - 1].outTs : null;
  // มาสาย: นับจากเวลาเข้ากะ (ไม่หักผ่อนผัน) สายเมื่อเกินผ่อนผัน
  const startOk = typeof c.shiftStart === 'string' && HHMM_RE.test(c.shiftStart);
  const graceMin = typeof c.graceMin === 'number' ? c.graceMin : 5;
  const lateRawMin = nSeg && startOk ? Math.floor((firstInTs - tsOf(d, c.shiftStart)) / MIN_MS) : null;
  const isLate = lateRawMin != null && lateRawMin > graceMin;
  // ออกก่อนเวลา: เฉพาะวันที่ครบ (ทุกกะมีเวลาออก) เทียบเวลาออกสุดท้ายกับเวลาเลิกกะ; เลิกกะน้อยกว่าเข้ากะ = ข้ามคืน (วันถัดไป)
  const endStr = c.shiftEnd == null || c.shiftEnd === '' ? (startOk && c.shiftStart >= '18:00' ? null : '18:00') : c.shiftEnd;   // ค่าเริ่มต้น 18:00 ใช้เมื่อเข้ากะก่อน 18:00 เท่านั้น
  const endOk = typeof endStr === 'string' && HHMM_RE.test(endStr);
  const complete = nSeg > 0 && openStatus === null && lastOutTs != null;
  const shiftEndTs = endOk ? tsOf(d, endStr, startOk && endStr < c.shiftStart) : null;
  const earlyRawMin = complete && endOk ? floorMin(shiftEndTs) - floorMin(lastOutTs) : null;
  const isEarly = earlyRawMin != null && earlyRawMin > 0;
  // สาขา + พักเกิน (ต่อวัน: พักรวมทุกกะ > เวลาพักของสาขา)
  const branchIds = [...new Set(sum.ev.map((l) => l.branchId).filter(Boolean))];
  const branchId = (nSeg && segs[0].branchId) || c.homeBranchId || null;
  const limRaw = typeof c.breakLimitFor === 'function' ? c.breakLimitFor(branchId) : null;
  const lim = limRaw == null || limRaw === '' ? NaN : Number(limRaw);
  const breakLimitMin = Number.isFinite(lim) ? lim : 60;
  const isOverBreak = breakMinAll > breakLimitMin;
  const all = Object.values(logsObj || {}).filter((l) => l && typeof l === 'object');
  const anomalies = [];
  if (segs.some((g) => g.openBreakAtOut)) anomalies.push('openBreakAtOut');
  if (segs.some((g) => g.orphanOut)) anomalies.push('orphanOut');   // out ซ้ำในกะที่ปิดแล้ว: ไม่เปิดกะใหม่ ไม่นับ
  if (segs.some((g) => g.netMin != null && g.netMin < 0)) anomalies.push('negativeNet');
  if (segs.some((g) => g.status === 'closed' && floorMin(g.outTs) - floorMin(g.inTs) > 960)) anomalies.push('longShift');
  return {
    d, sum, segs, worked: nSeg > 0, firstInTs, lastOutTs, netMin, breakMin, breakMinAll,
    closedCount: closedSegs.length, openStatus,
    lateRawMin, isLate, lateMin: isLate ? lateRawMin : 0,
    earlyRawMin, isEarly, earlyMin: isEarly ? earlyRawMin : (earlyRawMin != null ? 0 : null), shiftEndTs,
    breakLimitMin, isOverBreak, overBreakMin: isOverBreak ? breakMinAll - breakLimitMin : 0,
    branchId, branchIds, multiBranch: branchIds.length > 1,
    flagsPending: sum.flags,
    hasAdmin: sum.ev.some((l) => l.source === 'admin'), hasEdited: all.some((l) => l.origTs !== undefined), hasExcluded: all.some(isExcluded),
    anomalies
  };
}
// ==== SHARED CORE v3 END ====

// ==== REPORT CORE BEGIN — ฟังก์ชันล้วน ใช้ต่อท้าย SHARED CORE v3 มีเฉพาะใน clock-master.html (tests/core.test.mjs ตรวจ) ====
const MAX_RANGE_DAYS = 92;
const WEEKDAY_TH = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const weekdayTh = (d) => WEEKDAY_TH[new Date(Date.parse(d + 'T12:00:00+07:00')).getUTCDay()];
/** 'YYYY-MM' -> { from, to } (วันแรก-วันสุดท้ายของเดือน เป็น key string ไม่พึ่ง timezone ของเครื่อง) */
function monthRange(ym) {
  const m = /^(\d{4})-(\d{2})$/.exec(String(ym));
  if (!m || +m[2] < 1 || +m[2] > 12) return null;
  const last = new Date(Date.UTC(+m[1], +m[2], 0)).getUTCDate();
  return { from: m[1] + '-' + m[2] + '-01', to: m[1] + '-' + m[2] + '-' + String(last).padStart(2, '0') };
}
/** รายการวัน from..to (เก่า -> ใหม่); null ถ้าไม่ถูกรูปแบบ, to < from หรือเกิน max วัน */
function datesBetween(from, to, max) {
  const re = /^\d{4}-\d{2}-\d{2}$/;
  if (!re.test(from) || !re.test(to) || to < from) return null;
  const lim = max || MAX_RANGE_DAYS, out = [];
  let d = from;
  while (d <= to) { out.push(d); if (out.length > lim) return null; d = addDaysKey(d, 1); }
  return out;
}
/** ข้อความใน CSV: กัน CSV injection ด้วย ' นำหน้าเมื่อขึ้นต้น = + - @ TAB CR แล้วครอบ "" เมื่อมี , " CR LF */
function csvText(s) {
  let t = String(s == null ? '' : s);
  if (/^[=+\-@\t\r]/.test(t)) t = "'" + t;
  if (/[",\r\n]/.test(t)) t = '"' + t.replace(/"/g, '""') + '"';
  return t;
}
/**
 * รหัสพนักงาน (push id ขึ้นต้นด้วย '-' ซึ่ง Excel อาจตีเป็นสูตรแล้วขึ้น #NAME?) ใส่คำนำหน้า id: เสมอ (id:-OAa1)
 * ไม่ใช้ ' นำหน้า (เห็นเป็นตัวอักษรเกิน) ไม่ใช้ ="..." (เป็นสูตรเอง) คำนำหน้าเป็นส่วนของรูปแบบรหัสที่ระบุใน README ใช้ join ข้ามไฟล์ได้
 * รหัสที่ไม่ตรงรูปแบบ (ไม่ควรเกิด) ผ่าน csvText ตามปกติ
 */
const ID_RE = /^[-_A-Za-z0-9]{1,40}$/;
function csvId(sid) { const t = String(sid == null ? '' : sid); return ID_RE.test(t) ? 'id:' + t : csvText(t); }
/** ตัวเลขที่ระบบคำนวณ (ไม่ guard เพราะไม่ใช่ข้อความจากผู้ใช้): null/undefined/NaN = ช่องว่าง */
function csvNum(n, digits) {
  if (n == null || typeof n !== 'number' || !Number.isFinite(n)) return '';
  return digits == null ? String(n) : n.toFixed(digits);
}
/** BOM + CRLF (มี CRLF ท้ายไฟล์) ไม่มีบรรทัด sep= */
function toCsv(header, rows) {
  return '\uFEFF' + [header, ...rows].map((r) => r.join(',')).join('\r\n') + '\r\n';
}
const minToHr = (m) => (m == null ? null : m / 60);

/**
 * สร้างรายงานช่วง from..to
 * inp = { from, to, staff, branches, settings, state, logsFor(d), daysFor(d), sid, branch, inactive, onlyConfirmed, now }
 * logsFor(d) -> { sid: { lid: log } } ; daysFor(d) -> { sid: { confirmed } }
 */
function buildReport(inp) {
  const dates = datesBetween(inp.from, inp.to);
  if (!dates) return { error: 'ช่วงวันที่ไม่ถูกต้อง หรือเกิน ' + MAX_RANGE_DAYS + ' วัน' };
  const staff = inp.staff || {}, branches = inp.branches || {}, settings = inp.settings || {};
  const g = Number(settings.lateGraceMin);
  const graceMin = Number.isFinite(g) ? g : 5;
  const rows = [];
  for (const d of dates) {
    const lg = (inp.logsFor && inp.logsFor(d)) || {}, dy = (inp.daysFor && inp.daysFor(d)) || {};
    for (const sid of Object.keys(lg)) {
      if (inp.sid && inp.sid !== 'all' && inp.sid !== sid) continue;
      const s = staff[sid] || null;
      if (s && s.active === false && !inp.inactive) continue;
      const rep = dayReport(d, lg[sid], {
        shiftStart: s && s.shiftStart, shiftEnd: s && s.shiftEnd, graceMin, homeBranchId: s && s.branchId,
        breakLimitFor: (b) => (branches[b] || {}).breakLimitMin, state: (inp.state || {})[sid], now: inp.now
      });
      if (!rep.worked) continue;
      if (inp.branch && inp.branch !== 'all' && rep.branchId !== inp.branch) continue;
      const confirmed = !!(dy[sid] && dy[sid].confirmed === true);
      if (inp.onlyConfirmed && !confirmed) continue;
      rows.push({ d, sid, s, name: s ? s.nickname + (s.active === false ? ' (ปิดบัญชี)' : '') : '(ไม่พบในรายชื่อ) ' + sid, rep, confirmed });
    }
  }
  const blank = (sid, s) => ({ sid, s, name: s ? s.nickname + (s.active === false ? ' (ปิดบัญชี)' : '') : '(ไม่พบในรายชื่อ) ' + sid, branchId: s ? s.branchId : null, days: 0, completeDays: 0, missingDays: 0, liveDays: 0, netMin: 0, breakMin: 0, lateCount: 0, lateMin: 0, overCount: 0, overMin: 0, earlyCount: 0, earlyMin: 0, unconfirmed: 0, pendingDays: 0 });
  const map = new Map();
  for (const [sid, s] of Object.entries(staff)) {
    if (!s) continue;
    if (inp.sid && inp.sid !== 'all' && inp.sid !== sid) continue;
    if (s.active === false) continue;                      // คนปิดบัญชีแสดงเมื่อมีข้อมูลเท่านั้น
    if (inp.branch && inp.branch !== 'all' && s.branchId !== inp.branch) continue;
    map.set(sid, blank(sid, s));
  }
  for (const r of rows) {
    if (!map.has(r.sid)) map.set(r.sid, blank(r.sid, r.s));
    const p = map.get(r.sid), x = r.rep;
    p.days++;
    if (x.openStatus === null) p.completeDays++;
    if (x.openStatus === 'missing') p.missingDays++;
    if (x.openStatus === 'live') p.liveDays++;
    p.netMin += x.netMin; p.breakMin += x.breakMin;
    if (x.isLate) { p.lateCount++; p.lateMin += x.lateMin; }
    if (x.isOverBreak) { p.overCount++; p.overMin += x.overBreakMin; }
    if (x.isEarly) { p.earlyCount++; p.earlyMin += x.earlyMin; }
    if (!r.confirmed) p.unconfirmed++;
    if (x.flagsPending.size > 0) p.pendingDays++;
  }
  const people = [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'th'));
  const totals = blank('', null); totals.name = 'รวม';
  for (const p of people) for (const k of ['days', 'completeDays', 'missingDays', 'liveDays', 'netMin', 'breakMin', 'lateCount', 'lateMin', 'overCount', 'overMin', 'earlyCount', 'earlyMin', 'unconfirmed', 'pendingDays']) totals[k] += p[k];
  rows.sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : a.name.localeCompare(b.name, 'th')));
  return {
    from: inp.from, to: inp.to, dates, rows, people, totals,
    warnings: { unconfirmed: totals.unconfirmed, missing: totals.missingDays, live: totals.liveDays, pending: totals.pendingDays }
  };
}

/** ป้ายหมายเหตุของวัน (ใช้ทั้ง CSV และหน้าจอ) */
function remarksOf(rep) {
  const t = [];

  if (rep.flagsPending.size > 0) t.push('รอตรวจ');

/** CSV รายวัน 1 แถวต่อกะ; branchNameOf(bid) -> ชื่อสาขา */
function dailyCsv(report, branchNameOf) {
  const out = [];
  for (const r of report.rows) {
    const x = r.rep, nSeg = x.segs.length;
    x.segs.forEach((g, i) => {
      out.push([
        r.d, weekdayTh(r.d), csvText(r.name), csvText(branchNameOf ? branchNameOf(x.branchId) : x.branchId), String(g.n), hhmmOf(g.inTs), g.outTs == null ? '' : hhmmOf(g.outTs),
        g.outTs == null ? '' : g.outPlus ? '1' : '0', g.status === 'closed' ? csvNum(g.breakMin) : '', csvNum(g.netMin), csvNum(minToHr(g.netMin), 2),
        i === 0 ? csvNum(x.lateRawMin == null ? null : x.lateMin) : '', i === 0 ? csvNum(x.overBreakMin) : '',
        i === nSeg - 1 ? csvNum(x.earlyMin) : '',
        SEG_STATUS_TH[g.status], r.confirmed ? 'ยืนยันแล้ว' : 'ยังไม่ยืนยัน', csvText(remarksOf(x).join(' / ')), csvId(r.sid)
      ]);
    });
  }
  return toCsv(DAILY_HEAD, out);
}
/** CSV สรุปตามคน + แถวรวม */
function summaryCsv(report, branchNameOf) {
  const line = (p, isTotal) => [
    isTotal ? 'รวม' : csvText(p.name), isTotal ? '' : csvText(branchNameOf ? branchNameOf(p.branchId) : p.branchId), report.from, report.to,
    csvNum(p.days), csvNum(p.completeDays), csvNum(p.missingDays), csvNum(p.netMin), csvNum(minToHr(p.netMin), 2), csvNum(p.breakMin),
    csvNum(p.lateCount), csvNum(p.lateMin), csvNum(p.overCount), csvNum(p.overMin), csvNum(p.earlyCount), csvNum(p.earlyMin), csvNum(p.unconfirmed),
    isTotal ? '' : csvId(p.sid)
  ];
  return toCsv(SUMMARY_HEAD, [...report.people.map((p) => line(p, false)), line(report.totals, true)]);
}

const GRACE_MS = 15 * 60000;                       // ผ่อนผันเที่ยงคืน
const LONG_SHIFT_MS = 16 * 3600000;
const TYPE_TH = { in: 'เข้างาน', break_start: 'เริ่มพัก', break_end: 'กลับจากพัก', out: 'ออกงาน' };
const NEXT = { in: 'working', break_start: 'on_break', break_end: 'working', out: 'done' };
const midnightAfter = (d) => Date.parse(d + 'T00:00:00+07:00') + 86400000;
const plusDayOf = (d, ts) => bangkokDate(ts) > d;
const dayLabelF = new Intl.DateTimeFormat('th-TH', { timeZone: 'Asia/Bangkok', weekday: 'short', day: 'numeric', month: 'short' });
const dayLabel = (d) => dayLabelF.format(Date.parse(d + 'T12:00:00+07:00'));
/** เวลา HH:MM ของ ts + (+1) ถ้าข้ามวันของวันทำงาน d */
const fmtT = (ts, d) => fmtTime(ts) + (d && plusDayOf(d, ts) ? ' (+1)' : '');
/** กะที่วันทำงาน d "ไม่ตรงกับเวลาจริง" ของ in หรือไม่ (วันอนาคต / คนละวันเกินผ่อนผัน 15 นาทีหลังเที่ยงคืน) ถ้า in ถูกยืนยันแล้วไม่ติดธง */
function dateMismatch(d, inLog, now) {
  if (inLog && inLog.review === 'approved') return false;
  if (d > bangkokDate(now)) return true;
  if (!inLog || typeof inLog.ts !== 'number') return false;
  if (bangkokDate(inLog.ts) === d) return false;
  const mid = midnightAfter(d);
  return !(inLog.ts >= mid && inLog.ts < mid + GRACE_MS);
}

/** ตรวจลำดับเหตุการณ์ของวัน d (ev เรียงตามเวลาและนับเฉพาะรายการที่นับ) -> { errors, warnings, closed, segments } */
function validateSeq(d, ev, now) {
  const errors = [], warnings = [], segments = [];
  const add = (arr, m) => { if (!arr.includes(m)) arr.push(m); };
  let status = 'off', cur = null;
  ev.forEach((e, i) => {
    const at = `${TYPE_TH[e.type] || e.type} ${fmtT(e.ts, d)}`;
    if (e.ts > now + 2000) add(errors, `${at} — เวลาอยู่ในอนาคต`);
    if (i > 0 && e.ts <= ev[i - 1].ts) add(errors, 'เวลาต้องเรียงจากก่อนไปหลัง (มีรายการเวลาเท่ากัน)');
    if (i === 0 && e.type !== 'in') add(errors, `รายการแรกต้องเป็นเข้างาน (ตอนนี้เป็น ${TYPE_TH[e.type]})`);
    if (e.type === 'in') {
      if (status === 'working' || status === 'on_break') add(errors, `เข้างานซ้ำโดยยังไม่ออกงาน (${fmtT(e.ts, d)})`);
      cur = { inTs: e.ts, outTs: null, breakMs: 0, openBreak: null }; segments.push(cur); status = 'working';
    } else if (e.type === 'break_start') {
      if (status === 'working') { cur.openBreak = e.ts; status = 'on_break'; }
      else add(errors, status === 'on_break' ? `เริ่มพักซ้ำ (${fmtT(e.ts, d)})` : `เริ่มพักโดยไม่ได้อยู่ในกะ (${fmtT(e.ts, d)})`);
    } else if (e.type === 'break_end') {
      if (status === 'on_break') { cur.breakMs += e.ts - cur.openBreak; cur.openBreak = null; status = 'working'; }
      else add(errors, `กลับจากพักโดยไม่มีเริ่มพัก (${fmtT(e.ts, d)})`);
    } else if (e.type === 'out') {
      if (status === 'working') { cur.outTs = e.ts; status = 'done'; }
      else if (status === 'on_break') add(errors, 'ต้องกลับจากพักก่อนออกงาน');
      else add(errors, `ออกงานโดยไม่ได้เข้างาน (${fmtT(e.ts, d)})`);
    }
  });
  for (const g of segments) {
    if (g.outTs == null) continue;
    if (g.outTs - g.inTs > 24 * 3600000) add(errors, `กะเริ่ม ${fmtT(g.inTs, d)} ยาวเกิน 24 ชั่วโมง`);
    else if (g.outTs - g.inTs > LONG_SHIFT_MS) add(warnings, `กะเริ่ม ${fmtT(g.inTs, d)} ยาวเกิน 16 ชั่วโมง`);
  }
  if (segments.length > 1) add(warnings, `มี ${segments.length} กะในวันเดียว`);
  if (segments[0] && bangkokDate(segments[0].inTs) !== d && !(segments[0].inTs >= midnightAfter(d) && segments[0].inTs < midnightAfter(d) + GRACE_MS)) add(warnings, `เวลาเข้างานแรกไม่อยู่ในวันที่ ${d}`);
  const closed = ev.length === 0 || status === 'done';
  if (!closed && ev.length) add(warnings, 'ยังไม่มีเวลาออก');
  return { errors, warnings, closed, segments };
}

/**
 * คำนวณ state ใหม่หลังแอดมินแก้ (ข้อ 5.4) -> { state, error } state=null แปลว่าไม่ต้องเขียน
 * evAfter = รายการที่นับของวัน d เรียงเวลา (มี id, branchId, lat/lng ถ้าเป็น log app)
 */
function deriveState(sid, d, evAfter, oldState, now, force) {
  const affects = force || !oldState || !oldState.workDate || d >= oldState.workDate;
  if (!affects) return { state: null };
  const oldLive = oldState && (oldState.status === 'working' || oldState.status === 'on_break') && now - (oldState.inAt || 0) <= STALE_MS;
  if (!force && oldState && oldState.workDate && d > oldState.workDate && oldLive) return { state: null, error: `กะวันที่ ${oldState.workDate} ยังไม่ปิด — เพิ่มเวลาออกของกะนั้นก่อน` };
  if (!evAfter.length) {
    if (force && !(oldState && oldState.status === 'off' && oldState.workDate === d)) return { state: { status: 'off', workDate: d, since: Math.round(now) - 31000, prevLogId: (oldState && oldState.lastLogId) || '-' } };
    if (oldState && oldState.workDate === d && oldState.status !== 'off') return { state: { status: 'off', workDate: d, since: Math.round(now) - 31000, prevLogId: oldState.lastLogId || '-' } };
    return { state: null };
  }
  const last = evAfter[evAfter.length - 1];
  let seg = null;
  for (const e of evAfter) { if (e.type === 'in') seg = e.ts; }
  if (seg == null) return { state: null, error: 'ไม่พบเวลาเข้างานของกะ' };
  const st = { status: NEXT[last.type], workDate: d, since: last.ts, inAt: seg, lastLogId: last.id };
  if (last.branchId) st.lastBranchId = last.branchId;
  const lastApp = [...evAfter].reverse().find((e) => e.source === 'app' && typeof e.lat === 'number');
  if (lastApp) { st.lastLat = lastApp.lat; st.lastLng = lastApp.lng; }
  if (oldState && ['status', 'workDate', 'inAt', 'lastLogId', 'since'].every((k) => oldState[k] === st[k])) return { state: null };
  st.prevLogId = (oldState && oldState.lastLogId) || '-';
  return { state: st };
}

/** ข้อความสถานะภาษาไทยของ state ที่จะเขียน */
function stateText(st) {
  const m = { off: 'ยังไม่ได้เข้างาน', working: 'ทำงานอยู่', on_break: 'พักอยู่', done: 'ออกงานแล้ว' };
  return `${m[st.status] || st.status} (กะ ${dayLabel(st.workDate)})`;
}

/**
 * ใส่ audit ให้ทุก node (ข้อ 4): items = [{ path, before?, after, op }]
 * logs/state/days ต้องพก auditId ใหม่ (rules ตรวจ); logs ใส่ editedBy/editedAt ด้วย; before ของ node ใหม่ต้องไม่มี key
 */
function withAudit(updates, items, opts) {
  const o = opts || {};
  for (const it of items) {
    const aid = push(A('audit')).key;
    const bound = it.path.startsWith('logs/') || it.path.startsWith('state/') || it.path.startsWith('days/');
    const after = bound ? Object.assign({}, it.after, { auditId: aid }) : Object.assign({}, it.after);
    if (it.path.startsWith('logs/')) { after.editedBy = uidNow; after.editedAt = serverTimestamp(); }
    updates[it.path] = after;
    const a = { path: it.path, after, by: uidNow, byEmail: auth.currentUser.email, at: serverTimestamp(), op: it.op, group: o.group };
    if (it.before) a.before = clean(it.before);
    if (o.refId) a.ref = o.refId;
    if (o.reason) a.reason = o.reason.slice(0, 300);
    updates['audit/' + aid] = a;
  }
  return updates;
}
/** ตัดฟิลด์ที่เป็น null/undefined ออก (RTDB ไม่เก็บ null ใน object ซ้อน) */
function clean(obj) { const r = {}; for (const [k, v] of Object.entries(obj)) if (v !== null && v !== undefined) r[k] = v; return r; }

/** สร้างแผนการแก้ของวัน d ของพนักงาน sid (ยังไม่เขียนอะไร) -> { error } | { changed, evAfter, v, st, ... } */
function planChange({ sid, d, fresh, edits, now, force }) {
  const logsAfter = {};
  for (const [id, l] of Object.entries(fresh.logs || {})) logsAfter[id] = l;
  const changed = [];
  for (const ed of edits) {
    if (ed.create) {
      const id = ed.id || push(A(`logs/${d}/${sid}`)).key;
      const node = { type: ed.create.type, ts: ed.create.ts, branchId: ed.create.branchId, source: 'admin' };
      if (ed.create.note) node.note = ed.create.note;
      if (ed.create.correctionId) node.correctionId = ed.create.correctionId;
      logsAfter[id] = node; changed.push({ id, before: null, after: node, op: ed.op || 'add_log' });
    } else {
      const old = fresh.logs[ed.id];
      if (!old) return { error: 'ไม่พบรายการที่จะแก้ (อาจถูกเปลี่ยนไปแล้ว) โหลดใหม่แล้วลองอีกครั้ง' };
      const node = Object.assign({}, logsAfter[ed.id]);
      for (const [k, v] of Object.entries(ed.set)) { if (v === null || v === undefined) delete node[k]; else node[k] = v; }
      if (ed.set.ts !== undefined && ed.set.ts !== old.ts && old.source === 'app' && old.origTs === undefined) node.origTs = old.ts;   // เก็บเวลาจริงจากเซิร์ฟเวอร์ไว้ถาวร
      if (JSON.stringify(sortKeys(node)) === JSON.stringify(sortKeys(logsAfter[ed.id]))) continue;
      logsAfter[ed.id] = node;
      const prior = changed.find((c) => c.id === ed.id);
      if (prior) { prior.after = node; } else changed.push({ id: ed.id, before: old, after: node, op: ed.op || (ed.set.ts !== undefined ? 'edit_log' : ed.set.voided !== undefined ? 'void_log' : ed.set.review !== undefined ? 'review_log' : 'edit_log') });
    }
  }
  const evAfter = logsToList(logsAfter).filter((l) => typeof l.ts === 'number' && !isExcluded(l));
  const v = validateSeq(d, evAfter, now);
  const ds = deriveState(sid, d, evAfter, fresh.state, now, force);
  return { changed, evAfter, v, ds, logsAfter };
}
function sortKeys(o) { return Object.fromEntries(Object.entries(o).sort(([a], [b]) => (a < b ? -1 : 1))); }

/** รายการ audit/node ของแผน (ใช้ก่อนส่ง) */
function planItems(plan, sid, d) {
  const items = plan.changed.map((c) => ({ path: `logs/${d}/${sid}/${c.id}`, before: c.before, after: c.after, op: c.op }));
  if (plan.ds.state) items.push({ path: `state/${sid}`, before: plan.stateBefore, after: plan.ds.state, op: plan.stateOp || 'set_state' });
  return items;
}

/** อ่านสดของวัน (ไม่ใช้ค่าจาก listener) */
async function fetchDay(sid, d) {
  const [lg, st, dy] = await Promise.all([get(A(`logs/${d}/${sid}`)), get(A('state/' + sid)), get(A(`days/${d}/${sid}`))]);
  return { logs: lg.val() || {}, state: st.val(), day: dy.val() };
}
const staffName = (sid) => ((D.staff || {})[sid] || {}).nickname || sid;
const branchOfStaff = (sid) => ((D.staff || {})[sid] || {}).branchId;
/** สาขาที่ใช้กับ log ที่แอดมินสร้าง: สาขาของ log app ล่าสุดในวันนั้น ไม่มีก็สาขาหลักของพนักงาน */
function defaultBranch(sid, logsObj) {
  const apps = logsToList(logsObj).filter((l) => l.source === 'app' && l.branchId);
  return apps.length ? apps[apps.length - 1].branchId : branchOfStaff(sid) || Object.keys(D.branches || {})[0];
}
function timelineText(d, ev) {
  return ev.length ? ev.map((e) => `${TYPE_TH[e.type]} ${fmtT(e.ts, d)}`).join(' · ') : '(ไม่มีรายการ)';
}

/**
 * ขั้นตอนบันทึกแบบเดียวกันทุกการแก้ (ข้อ 5.5): อ่านสด -> ตรวจล็อกวัน -> validateSeq -> deriveState -> ตัวอย่าง -> withAudit -> update ครั้งเดียว
 * คืน true เมื่อบันทึกสำเร็จ
 * o = { sid, d, edits, op?, reason?, refId?, preview: 'always'|'warn'|'never', title, extraItems?:[], extraNodes?, approveSegmentOf?, sigCheck?: signature, stateOp? }
 */
async function commitDayChange(o) {
  const { sid, d } = o;
  let fresh;
  try { fresh = await fetchDay(sid, d); } catch (e) { toast('อ่านข้อมูลไม่สำเร็จ: ' + (e.code || e.message)); return false; }
  if (fresh.day && fresh.day.confirmed === true) { lockedPrompt(sid, d); return false; }
  if (o.sig && o.sig !== daySig(fresh)) { toast('ข้อมูลเปลี่ยนระหว่างแก้ (พนักงานอาจเพิ่งกด) — โหลดข้อมูลล่าสุดแล้ว กรุณาตรวจและลองอีกครั้ง'); if (o.onStale) o.onStale(); return false; }
  const now = serverNow();
  const plan = planChange({ sid, d, fresh, edits: o.edits, now, force: o.forceState });
  if (plan.error) { toast(plan.error); return false; }
  plan.stateBefore = fresh.state; plan.stateOp = o.stateOp;
  const problems = [...plan.v.errors];
  if (plan.ds.error) problems.push(plan.ds.error);
  if (o.confirmDay && !plan.v.closed) problems.push('ยืนยันวันไม่ได้: ยังไม่มีเวลาออก');
  if (problems.length) {
    if (o.onProblems && (await o.onProblems(problems, plan, fresh))) return 'retry';
    openModal('บันทึกไม่ได้', [h('p', null, `${staffName(sid)} · ${dayLabel(d)}`), h('ul', null, problems.map((m) => h('li', { style: 'color:#b91c1c' }, m)))], [{ label: 'ปิด', cls: 'gray' }]);
    return false;
  }
  if (!plan.changed.length && !plan.ds.state && !(o.extraItems || []).length && !o.confirmDay) { if (o.noChangeOk) return true; toast('ไม่มีอะไรเปลี่ยนแปลง'); return false; }
  const needPreview = o.preview === 'always' || (o.preview !== 'never' && (plan.v.warnings.length || plan.ds.state));
  if (needPreview) {
    const beforeEv = logsToList(fresh.logs).filter((l) => typeof l.ts === 'number' && !isExcluded(l));
    const body = [
      h('p', null, h('b', null, staffName(sid)), ' · ', dayLabel(d)),
      h('div', null, h('div', { class: 'muted' }, 'ก่อน'), h('div', null, timelineText(d, beforeEv))),
      h('div', { style: 'margin-top:6px' }, h('div', { class: 'muted' }, 'หลัง'), h('div', { style: 'font-weight:700' }, timelineText(d, plan.evAfter)))
    ];
    if (plan.ds.state) body.push(h('div', { class: 'notice' }, 'สถานะของ ' + staffName(sid) + ' จะเป็น: ' + stateText(plan.ds.state)));
    if (plan.ds.state && plan.ds.state.status === 'done' && plan.ds.state.workDate === bangkokDate(now)) body.push(h('div', { class: 'notice' }, `หลังบันทึก ${staffName(sid)} จะกดเข้างานวันนี้ไม่ได้อีก`));
    if (plan.v.warnings.length) body.push(h('ul', null, plan.v.warnings.map((m) => h('li', { style: 'color:#c2410c' }, m))));
    const ok = await new Promise((res) => openModal(o.title || 'ตรวจก่อนบันทึก', body, [{ label: 'ยกเลิก', onClick: () => res(false) }, { label: 'ยืนยันบันทึก', cls: 'blue', onClick: () => res(true) }]));
    if (!ok) return false;
  }
  const items = planItems(plan, sid, d).concat(o.extraItems || []);
  if (o.confirmDay) items.push({ path: `days/${d}/${sid}`, before: fresh.day, after: { confirmed: true, confirmedBy: uidNow, confirmedAt: serverTimestamp() }, op: 'confirm_day' });
  const group = push(A('audit')).key;
  const updates = withAudit({}, items, { group, refId: o.refId, reason: o.reason });
  Object.assign(updates, o.extraNodes || {});
  try { await update(A(''), updates); }
  catch (e) {
    if (e && e.code === 'PERMISSION_DENIED') toast('ข้อมูลเปลี่ยนระหว่างแก้ (พนักงานอาจเพิ่งกด) หรือวันถูกยืนยันแล้ว — ตรวจแล้วลองอีกครั้ง');
    else toast('บันทึกไม่สำเร็จ: ' + (e.code || e.message));
    return false;
  }
  T.cache = { logs: {}, days: {} };
  refresh();
  return true;
}
/** ลายเซ็นของข้อมูลวันที่ ใช้ตรวจว่าระหว่างที่ตัวแก้ไขเปิดค้างมีใครเขียนทับหรือไม่ */
function daySig(fresh) {
  return JSON.stringify([Object.entries(fresh.logs || {}).map(([id, l]) => [id, l.ts, l.voided === true, l.review || '']).sort(), (fresh.state || {}).lastLogId || '', (fresh.state || {}).status || '']);
}

function lockedPrompt(sid, d) {
  openModal('วันนี้ยืนยันแล้ว', [h('p', null, `${staffName(sid)} · ${dayLabel(d)} ถูกล็อกไว้ ต้องปลดล็อกก่อนจึงแก้ได้`)], [
    { label: 'ปิด', cls: 'gray' },
    { label: 'ปลดล็อก', cls: 'orange', onClick: async () => { const ok = await unlockDay(sid, d); if (ok) toast('ปลดล็อกแล้ว ลองแก้อีกครั้ง'); } }
  ]);
}
async function unlockDay(sid, d) {
  try {
    const cur = (await get(A(`days/${d}/${sid}`))).val();
    if (!cur || cur.confirmed !== true) return true;
    const after = { confirmed: false }; if (cur.confirmedBy) after.confirmedBy = cur.confirmedBy; if (typeof cur.confirmedAt === 'number') after.confirmedAt = cur.confirmedAt;
    if (cur.note) after.note = cur.note;
    const group = push(A('audit')).key;
    await update(A(''), withAudit({}, [{ path: `days/${d}/${sid}`, before: cur, after, op: 'unlock_day' }], { group }));
    T.cache = { logs: {}, days: {} }; refresh();
    return true;
  } catch (e) { toast('ปลดล็อกไม่สำเร็จ: ' + (e.code || e.message)); return false; }
}
/** ยืนยันหลายแถว: แถวที่ไม่ผ่านเงื่อนไขข้าม แล้วสรุป */
async function confirmDays(rows, opts) {
  const o = opts || {};
  const ok = [], skipped = [];
  const updates = {}; const group = push(A('audit')).key;
  for (const r of rows) {
    let fresh;
    try { fresh = await fetchDay(r.sid, r.d); } catch (e) { skipped.push(`${staffName(r.sid)} ${dayLabel(r.d)}: อ่านข้อมูลไม่สำเร็จ`); continue; }
    if (fresh.day && fresh.day.confirmed === true) { skipped.push(`${staffName(r.sid)} ${dayLabel(r.d)}: ยืนยันแล้ว`); continue; }
    const ev = logsToList(fresh.logs).filter((l) => typeof l.ts === 'number' && !isExcluded(l));
    const v = validateSeq(r.d, ev, serverNow());
    if (v.errors.length) { skipped.push(`${staffName(r.sid)} ${dayLabel(r.d)}: ${v.errors[0]}`); continue; }
    if (!v.closed) { skipped.push(`${staffName(r.sid)} ${dayLabel(r.d)}: ยังไม่มีเวลาออก`); continue; }
    const pend = pendingFor(r.sid, r.d);
    if (pend && !o.force) { r.needAsk = pend; }
    ok.push({ r, fresh, pend });
  }
  const askRows = ok.filter((x) => x.pend);
  if (askRows.length && !o.force) {
    const go = await confirmBox('ยังมีรายการรอตรวจ', `มีรายการรอตรวจ/คำขอที่ยังไม่ตัดสินใน ${askRows.length} แถว ยืนยันต่อหรือไม่`, 'ยืนยันต่อ', 'orange');
    if (!go) return false;
  }
  for (const x of ok) {
    const after = { confirmed: true, confirmedBy: uidNow, confirmedAt: serverTimestamp() };
    withAudit(updates, [{ path: `days/${x.r.d}/${x.r.sid}`, before: x.fresh.day, after, op: 'confirm_day' }], { group });
  }
  if (!ok.length) { toast('ไม่มีแถวที่ยืนยันได้\n' + skipped.join('\n')); return false; }
  try { await update(A(''), updates); }
  catch (e) { toast('ยืนยันไม่สำเร็จ: ' + (e.code || e.message) + ' (เช่น กะยังเปิดอยู่ หรือข้อมูลเปลี่ยน)'); return false; }
  T.cache = { logs: {}, days: {} }; refresh();
  if (skipped.length) toast(`ยืนยัน ${ok.length} แถว ข้าม ${skipped.length} แถว:\n` + skipped.join('\n'));
  return true;
}
/** มีรายการรอตรวจหรือคำขอ pending ของวัน/คนนั้นหรือไม่ -> จำนวน */
function pendingFor(sid, d) {
  let n = reviewItems().filter((it) => it.sid === sid && it.d === d).length;
  n += Object.values(D.corrPending || {}).filter((c) => c && c.staffId === sid && c.workDate === d).length;
  return n;
}

/* เก็บ audit แบบ best-effort ของ staff/branches (ไม่บังคับใน rules) ใส่ใน update เดียวกัน */
function bestEffortAudit(updates, path, before, after, op) {
  const aid = push(A('audit')).key;
  const a = { path, by: uidNow, byEmail: auth.currentUser.email, at: serverTimestamp(), op, after: clean(after) };
  if (before) a.before = clean(before);
  updates['audit/' + aid] = a;
  return updates;
}

/* ====== 1. สถานะวันนี้ ====== */
/** ctx ของ dayReport จากข้อมูลสดของ master (ค่าปัจจุบันของ shiftStart/shiftEnd/breakLimitMin/lateGraceMin ใช้กับทุกวัน) */
function ctxFor(sid, s, now) {
  const g = Number((D.settings || {}).lateGraceMin);
  return {
    shiftStart: s && s.shiftStart, shiftEnd: s && s.shiftEnd, graceMin: Number.isFinite(g) ? g : 5, homeBranchId: s && s.branchId,

function personStatus(sid, s, today, now) {
  const st = (D.state || {})[sid];
  const out = { cls: 's-none', text: 'ยังไม่มา', tags: [], branchId: s.branchId, late: false };
  if (!st || !st.workDate) return out;
  const live = st.status === 'working' || st.status === 'on_break';
  const stale = live && typeof st.inAt === 'number' && now - st.inAt > STALE_MS;
  const sum = summarize(((D.logsWin || {})[st.workDate] || {})[sid]);
  const seg = sum.segments[sum.segments.length - 1] || null;     // กะล่าสุดของวัน
  const yesterday = bangkokDate(now - 86400000);
  const prevShiftDone = !live && st.workDate === yesterday && sum.outTs != null && bangkokDate(sum.outTs) === today;
  const future = st.workDate > today;
  if (!live && st.workDate !== today && !prevShiftDone && !future) return out;
  if (st.lastBranchId) out.branchId = st.lastBranchId;
  const brk = (seg ? seg.breakMs : 0) + (seg && seg.openBreak != null ? now - seg.openBreak : 0);
  const lim = Number(((D.branches || {})[out.branchId] || {}).breakLimitMin ?? 60) * 60000;
  const rep = dayReport(st.workDate, ((D.logsWin || {})[st.workDate] || {})[sid], ctxFor(sid, s, now));
  if (rep.isLate) { out.late = true; out.tags.push({ t: `สาย ${rep.lateMin} นาที`, c: 'late' }); }
  // เตือนเมื่อวันทำงานไม่ตรงกับเวลาจริงของ in (หายเมื่อเจ้าของกด ✔ ยืนยัน) หรือ state ไม่มี log รองรับ
  if (dateMismatch(st.workDate, sum.segments[0] ? sum.segments[0].inLog : null, now) || (live && !stale && !sum.ev.length)) out.tags.push({ t: 'วันทำงานไม่ตรงกับเวลาจริง ตรวจสอบ', c: 'bad' });
  if (sum.flags.has('suspect')) out.tags.push({ t: 'น่าสงสัย', c: 'bad' });
  else if (sum.flags.has('borderline')) out.tags.push({ t: 'ใกล้ขอบเขต', c: 'late' });
  if (stale) { out.cls = 's-stale'; out.text = 'ลืมออกงาน (เข้าเมื่อ ' + fmtTime(st.inAt) + ')'; }
  else if (st.status === 'working') { out.cls = 's-work'; out.text = 'ทำงาน ตั้งแต่ ' + fmtTime(seg ? seg.inTs : st.inAt); if (seg && seg.breakMs) out.text += ' · พักไปแล้ว ' + fmtMin(seg.breakMs / 60000); }
  else if (st.status === 'on_break') { out.cls = 's-break' + (brk > lim ? ' over' : ''); out.text = 'พักอยู่ ' + fmtClock(now - ((seg && seg.openBreak) ?? now)) + ' (รวม ' + fmtMin(brk / 60000) + ')'; }
  else if (st.status === 'done' && seg && seg.outTs != null) {
    out.cls = 's-done'; out.text = `ออกแล้ว${prevShiftDone ? ' (กะเมื่อวาน)' : ''} ${fmtTime(seg.outTs)} · สุทธิ ${fmtMin(rep.netMin)}`;
  } else if (st.status === 'done') { out.cls = 's-done'; out.text = 'ออกแล้ว'; }
  return out;
}

async function inlineSave(r, which, val) {

  } else {

    if (seg.outLog) { if (val === fmtTime(seg.outTs)) { T.inline = null; renderTimes(true); return; } edits = [{ id: seg.outLog.id, set: { ts: tsOf(d, val, plus) } }]; }
    else edits = [{ create: { type: 'out', ts: tsOf(d, val, plus), branchId: defaultBranch(sid, r.raw) } }];

  const ok = await commitDayChange({ sid, d, edits, preview: 'warn', title: 'แก้เวลา' });

}

/* ====== 3. รอตรวจ ====== */
let reviewMap = null, reviewLayer = null, selectedKey = null;

/** รายการที่ต้องตรวจ (ข้อ 8.1.1) สร้างจาก D.logsWin / D.state / D.days ข้ามวันที่ยืนยันแล้ว */
function reviewItems() {
  if (!D.days || !D.state || !D.staff) return [];
  const now = serverNow(), today = bangkokDate(now);
  const items = new Map();
  const add = (d, sid, log, kind, reason) => {
    const key = `${d}|${sid}|${log.id}`;
    let it = items.get(key);
    if (!it) { it = { key, d, sid, id: log.id, log, kinds: new Set(), reasons: [] }; items.set(key, it); }
    it.kinds.add(kind); it.reasons.push(reason);
  };
  for (const d of Object.keys(D.logsWin).sort().reverse()) {
    const per = D.logsWin[d] || {};
    for (const sid of Object.keys(per)) {
      if (((D.days[d] || {})[sid] || {}).confirmed === true) continue;
      const sum = summarize(per[sid]);
      const st = D.state[sid];
      for (const e of sum.ev) if (e.flag && !e.review) add(d, sid, e, 'flag', { c: e.flag === 'suspect' ? 'bad' : 'late', t: flagThai(e) });
      sum.segments.forEach((g, i) => {
        if (dateMismatch(d, g.inLog, now)) add(d, sid, g.inLog, 'mismatch', { c: 'bad', t: `บันทึกเป็นวันที่ ${d} แต่เวลาจริงคือ ${bangkokDate(g.inLog.ts)} ${fmtTime(g.inLog.ts)}` });
        if (g.outTs != null && g.outTs - g.inTs > LONG_SHIFT_MS && !g.outLog.review) add(d, sid, g.outLog, 'long', { c: 'late', t: `ทำงาน ${fmtMin((g.outTs - g.inTs) / 60000)} (ยาวผิดปกติ)` });
        if (g.outTs == null) {
          const live = st && st.workDate === d && (st.status === 'working' || st.status === 'on_break');
          const stale = live && typeof st.inAt === 'number' && now - st.inAt > STALE_MS;
          if (i < sum.segments.length - 1 || !live || stale) add(d, sid, g.inLog, 'forgot', { c: 'bad', t: `เข้า ${fmtTime(g.inTs)} ไม่มีเวลาออก` });
        }
      });
    }
  }
  const list = [...items.values()];
  for (const [sid, st] of Object.entries(D.state || {})) {
    if (!st || !st.workDate || !D.staff[sid] || D.staff[sid].active === false) continue;
    const live = st.status === 'working' || st.status === 'on_break';
    if ((live && (st.workDate < bangkokDate(now - 86400000) || st.workDate > today)) || st.workDate > today) {
      list.push({ key: 'anomaly|' + sid, d: st.workDate, sid, id: null, log: null, kinds: new Set(['anomaly']), reasons: [{ c: 'bad', t: `สถานะอ้างวันที่ ${st.workDate} (${st.status})` }] });
    }
  }
  list.sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : (staffName(a.sid) || '').localeCompare(staffName(b.sid) || '', 'th')));
  return list;
}

  if (typeof l.accuracy === 'number') { const a = L.circle([l.lat, l.lng], { radius: l.accuracy, color: '#2563eb', weight: 1, fillOpacity: .15 }).addTo(reviewLayer); bounds.push(a.getBounds()); }
  bounds.push(L.latLngBounds([l.lat, l.lng], [l.lat, l.lng]));
  let box = bounds[0]; for (const x of bounds.slice(1)) box = box.extend(x);
  reviewMap.fitBounds(box.pad(0.2), { maxZoom: 19 });
  let nowDist = '';
  if (typeof b.lat === 'number') {
    const d0 = haversineM(l.lat, l.lng, b.lat, b.lng);
    nowDist = ` · เทียบตำแหน่งร้านปัจจุบัน ${Math.round(d0)} ม.`;
  }
  cap.textContent = `ระยะตอนกด ${l.distance ?? '-'} ม. · ความแม่นยำ ±${l.accuracy ?? '-'} ม.${nowDist}`;
}
function haversineM(la1, ln1, la2, ln2) {
  const R = 6371008.8, r = Math.PI / 180, dLa = (la2 - la1) * r, dLn = (ln2 - ln1) * r;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLn / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

/** id ของทุกรายการ (ที่นับอยู่) ในกะเดียวกับ log id */
function segmentIds(logsObj, id) {
  const ev = logsToList(logsObj).filter((l) => typeof l.ts === 'number' && !isExcluded(l));
  const i = ev.findIndex((e) => e.id === id);
  if (i < 0) return [id];
  let a = i; while (a > 0 && ev[a].type !== 'in') a--;
  let b = i + 1; while (b < ev.length && ev[b].type !== 'in') b++;
  return ev.slice(a, b).map((e) => e.id);
}

/* ย้ายกะไปวันที่ถูกต้อง (8.1.4): คัดลอก log ของกะไป logs/{d2} แล้ว void ของเดิม ใน update เดียว */
async function moveShift(it) {
  let fresh1;
  try { fresh1 = await fetchDay(it.sid, it.d); } catch (e) { toast('อ่านข้อมูลไม่สำเร็จ: ' + (e.code || e.message)); return; }
  const ev1 = logsToList(fresh1.logs).filter((l) => typeof l.ts === 'number' && !isExcluded(l));
  const ids = segmentIds(fresh1.logs, it.id);
  const seg = ev1.filter((e) => ids.includes(e.id));
  const inLog = seg.find((e) => e.type === 'in');
  if (!inLog) { toast('ไม่พบเวลาเข้างานของกะ'); return; }
  const d2 = bangkokDate(inLog.ts);
  if (d2 === it.d) { toast('วันที่ตรงกันแล้ว'); return; }
  let fresh2;
  try { fresh2 = await fetchDay(it.sid, d2); } catch (e) { toast('อ่านข้อมูลไม่สำเร็จ: ' + (e.code || e.message)); return; }
  if ((fresh1.day && fresh1.day.confirmed === true) || (fresh2.day && fresh2.day.confirmed === true)) { toast('วันที่เกี่ยวข้องถูกยืนยันแล้ว ต้องปลดล็อกก่อน'); return; }
  const now = serverNow();
  const copies = seg.map((e) => { const { id, auditId, editedBy, editedAt, ...rest } = e; return { oldId: id, newId: push(A(`logs/${d2}/${it.sid}`)).key, node: { ...rest, movedFrom: `logs/${it.d}/${it.sid}/${id}` } }; });
  const ev2 = logsToList(fresh2.logs).filter((l) => typeof l.ts === 'number' && !isExcluded(l)).concat(copies.map((c) => ({ ...c.node, id: c.newId }))).sort((a, b) => a.ts - b.ts || (TYPE_ORDER[a.type] ?? 9) - (TYPE_ORDER[b.type] ?? 9));
  const v = validateSeq(d2, ev2, now);
  if (v.errors.length || ev2.length > copies.length) {
    toast(`วันที่ ${d2} มีกะอยู่แล้ว หรือลำดับไม่ถูกต้อง (${v.errors[0] || 'มีรายการอยู่ก่อน'}) ใช้ ✘ หรือแก้ในบันทึกเวลา`); return;
  }
  // state: ถ้ากะที่ย้ายคือ workDate ของ state ให้ย้ายตามไป d2
  let stItem = null;
  const old = fresh1.state;
  const ds = deriveState(it.sid, d2, ev2, old, now, !!(old && old.workDate === it.d));
  if (ds.error) { toast(ds.error); return; }
  if (ds.state) stItem = { path: `state/${it.sid}`, before: old, after: ds.state, op: 'move_log' };
  const ok = await confirmBox('ย้ายกะไปวันที่ถูกต้อง', `ย้าย ${seg.length} รายการของ ${staffName(it.sid)} จากวันที่ ${it.d} ไปวันที่ ${d2}` + (stItem ? ` · สถานะจะเป็น: ${stateText(ds.state)}` : ''), 'ย้าย', 'blue');
  if (!ok) return;
  const group = push(A('audit')).key;
  const items = [];
  for (const c of copies) {
    const old1 = fresh1.logs[c.oldId];
    items.push({ path: `logs/${it.d}/${it.sid}/${c.oldId}`, before: old1, after: { ...old1, voided: true, note: ((old1.note ? old1.note + ' · ' : '') + `ย้ายไป ${d2}`).slice(0, 200) }, op: 'move_log' });
    items.push({ path: `logs/${d2}/${it.sid}/${c.newId}`, after: c.node, op: 'move_log' });
  }
  if (stItem) items.push(stItem);
  const upd = withAudit({}, items, { group, reason: 'ย้ายวันทำงานให้ตรงเวลาจริง' });
  try { await update(A(''), upd); }
  catch (e) { toast(e && e.code === 'PERMISSION_DENIED' ? 'ข้อมูลเปลี่ยนระหว่างย้าย หรือวันถูกยืนยันแล้ว — ตรวจแล้วลองอีกครั้ง' : 'ย้ายไม่สำเร็จ: ' + (e.code || e.message)); return; }
  T.cache = { logs: {}, days: {} };
  refresh();
}

function buildCorrEdits(cid, c, f, fresh) {
  const d = c.workDate, sid = c.staffId;
  const t1 = tsOf(d, f.time, f.nextDay), t2 = c.type === 'break' ? tsOf(d, f.endTime, f.endNextDay) : null;

  const note = 'จากคำขอแก้เวลา';

  const create = (type, ts) => { const id = mkId(); edits.push({ id, create: { type, ts, branchId: br, note, correctionId: cid } }); return id; };
  const editLog = (id, ts) => { edits.push({ id, set: { ts, correctionId: cid } }); return id; };

/** ตัวเลือกเริ่มต้นของ "แก้รายการเดิม" ตามประเภท (ข้อ 6 ข้อ 3) -> { options:[{id,label}], def } */
function corrTargets(c, fresh) {
  const sum = summarize(fresh.logs);
  const d = c.workDate;
  const opts = [];
  let def = 'new';
  if (c.type === 'in') {
    sum.ev.filter((e) => e.type === 'in').forEach((e) => opts.push({ id: e.id, label: `แก้รายการเดิม: เข้า ${fmtT(e.ts, d)}` }));
    if (opts.length) def = opts[0].id;
  } else if (c.type === 'out') {
    const last = sum.segments[sum.segments.length - 1];
    sum.ev.filter((e) => e.type === 'out').forEach((e) => opts.push({ id: e.id, label: `แก้รายการเดิม: ออก ${fmtT(e.ts, d)}` }));
    if (last && last.outLog) def = last.outLog.id;
  } else if (c.type === 'break_end') {
    const t1 = tsOf(d, c.time, !!c.nextDay);
    const last = sum.segments[sum.segments.length - 1];
    const ends = sum.ev.filter((e) => e.type === 'break_end');
    ends.forEach((e) => opts.push({ id: e.id, label: `แก้รายการเดิม: กลับจากพัก ${fmtT(e.ts, d)}` }));
    if (!(last && last.openBreak != null) && ends.length) {
      const starts = sum.ev.filter((e) => e.type === 'break_start').sort((a, b) => Math.abs(a.ts - t1) - Math.abs(b.ts - t1));
      const s0 = starts[0];
      const after = s0 ? ends.find((e) => e.ts > s0.ts) : null;
      if (after) def = after.id;
    }
  }
  return { opts, def };
}

const R = { mode: 'month', month: '', from: '', to: '', sid: 'all', branch: 'all', inactive: true, onlyConfirmed: false, view: 'summary' };

/** อ่าน logs/days ช่วงเก่ากว่าหน้าต่าง reviewDays แบบ range query ครั้งเดียวอย่างละ 1 query แล้วเก็บ T.cache (ทั้งช่วง วันว่างเก็บ {}) */
function fetchRange(from, to) {
  const key = from + '..' + to;
  if (T.fetching.has(key) || T.failed.has(key)) return;
  T.fetching.add(key);
  Promise.all([get(query(A('logs'), orderByKey(), startAt(from), endAt(to))), get(query(A('days'), orderByKey(), startAt(from), endAt(to)))])
    .then(([l, dy]) => {
      const lv = l.val() || {}, dv = dy.val() || {};
      for (const d of datesBetween(from, to, 400) || []) { T.cache.logs[d] = lv[d] || {}; T.cache.days[d] = dv[d] || {}; }
    })
    .catch((e) => { T.failed.add(key); T.rangeErr = e.code || e.message; })
    .finally(() => { T.fetching.delete(key); if (curTab === 'times') renderTimes(); else if (curTab === 'report') renderReport(); });
}
/** วันที่เก่ากว่า winKey ที่ยังไม่มีใน cache -> ยิง range query ครั้งเดียวครอบทั้งช่วง; คืนจำนวนวันที่ยังรอ */
function ensureRange(dates) {
  const need = dates.filter((d) => d < winKey && (T.cache.logs[d] === undefined || T.cache.days[d] === undefined)).sort();
  if (need.length) fetchRange(need[0], need[need.length - 1]);
  return need.length;
}

    h('div', { class: 'row' },
      h('label', null, 'รัศมี (เมตร) 10-300', f.radius), h('label', null, ' ', f.radiusN),
      h('label', null, 'แม่นยำสูงสุดที่ยอมรับ (ม.)', f.maxAcc), h('label', null, 'ตัวคูณชายขอบ', f.grace),
      h('label', null, 'พักได้ไม่เกิน (นาที)', f.brk),
      h('label', null, 'เปิดใช้งาน', f.active)),
    err, h('div', { class: 'row' }, saveBtn));

  const map = L.map(mapDiv).setView(has ? [b.lat, b.lng] : THAI_CENTER, has ? 17 : 6);
  const layers = {
    'ดาวเทียม': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 18, attribution: 'Imagery &copy; Esri' }),
    'แผนที่ถนน': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, maxNativeZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' })
  };
  layers['ดาวเทียม'].addTo(map);
  L.control.layers(layers, null, { collapsed: false }).addTo(map);
  let marker = null, circle = null, dirty = false;
  const setDirty = (v) => { dirty = v; saveBtn.disabled = !v; };
  function draw(lat, lng) {
    const r = Number(f.radius.value) || 10;
    if (!marker) {
      marker = L.marker([lat, lng], { draggable: true }).addTo(map);
      circle = L.circle([lat, lng], { radius: r, color: '#16a34a', fillOpacity: .15 }).addTo(map);
      marker.on('drag', (e) => { const p = e.target.getLatLng(); circle.setLatLng(p); });
      marker.on('dragend', (e) => { const p = e.target.getLatLng(); f.lat.value = p.lat.toFixed(6); f.lng.value = p.lng.toFixed(6); setDirty(true); });
    } else { marker.setLatLng([lat, lng]); circle.setLatLng([lat, lng]); }
    circle.setRadius(r);
  }
  function fill(bb) {
    f.name.value = bb.name || ''; f.radius.value = f.radiusN.value = bb.radius ?? 10;
    f.maxAcc.value = bb.maxAccuracy ?? 30; f.grace.value = bb.graceFactor ?? 2; f.brk.value = bb.breakLimitMin ?? 60;
    f.active.checked = bb.active !== false;
    if (typeof bb.lat === 'number' && typeof bb.lng === 'number') { f.lat.value = bb.lat; f.lng.value = bb.lng; draw(bb.lat, bb.lng); map.setView([bb.lat, bb.lng], map.getZoom() < 15 ? 17 : map.getZoom(), { animate: false }); }
    else { f.lat.value = f.lng.value = ''; }
    setDirty(false);
  }
  fill(b);
  map.on('click', (e) => { f.lat.value = e.latlng.lat.toFixed(6); f.lng.value = e.latlng.lng.toFixed(6); draw(e.latlng.lat, e.latlng.lng); setDirty(true); });
  f.radius.addEventListener('input', () => { f.radiusN.value = f.radius.value; circle?.setRadius(Number(f.radius.value)); setDirty(true); });
  f.radiusN.addEventListener('input', () => { f.radius.value = f.radiusN.value; circle?.setRadius(Number(f.radiusN.value) || 10); setDirty(true); });
  const fromInputs = () => { const la = parseFloat(f.lat.value), ln = parseFloat(f.lng.value); if (isFinite(la) && isFinite(ln) && Math.abs(la) <= 90 && Math.abs(ln) <= 180) { draw(la, ln); map.setView([la, ln]); } setDirty(true); };
  f.lat.addEventListener('input', () => { const p = f.lat.value.includes(',') ? parseLatLng(f.lat.value) : null; if (p) { f.lat.value = p[0]; f.lng.value = p[1]; } fromInputs(); });
  f.lng.addEventListener('input', fromInputs);
  for (const k of ['name', 'maxAcc', 'grace', 'brk', 'active']) f[k].addEventListener('input', () => setDirty(true));
  f.active.addEventListener('change', () => setDirty(true));

  geoBtn.addEventListener('click', async () => {
    if (!navigator.geolocation) { accMsg.textContent = 'เครื่องนี้ไม่รองรับตำแหน่ง'; return; }
    geoBtn.disabled = true; accMsg.textContent = 'กำลังอ่านตำแหน่ง...';
    let best = null;
    for (let i = 0; i < 3; i++) {
      try {
        const p = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }));
        if (!best || p.coords.accuracy < best.coords.accuracy) best = p;
      } catch (e) { if (e.code === 1) { accMsg.textContent = 'ยังไม่ได้อนุญาตให้ใช้ตำแหน่ง'; geoBtn.disabled = false; return; } }
    }
    geoBtn.disabled = false;
    if (!best) { accMsg.textContent = 'หาตำแหน่งไม่ได้ ลองใหม่อีกครั้ง'; return; }
    f.lat.value = best.coords.latitude.toFixed(6); f.lng.value = best.coords.longitude.toFixed(6);
    draw(best.coords.latitude, best.coords.longitude); map.setView([best.coords.latitude, best.coords.longitude], 18); setDirty(true);
    const acc = Math.round(best.coords.accuracy);
    accMsg.textContent = acc > 15
      ? `⚠ แม่นยำแค่ ±${acc} ม. — จุดอาจคลาด แนะนำคลิกบนแผนที่ดาวเทียมให้ตรงหน้าร้านแทน`
      : `แม่นยำ ±${acc} ม. — ตรวจบนแผนที่ดาวเทียมว่าหมุดตรงหน้าร้าน ถ้าไม่ตรงลากหมุดได้`;
  });

  saveBtn.addEventListener('click', async () => {
    err.textContent = '';
    const nm = f.name.value.trim();
    const v = { name: nm, radius: Number(f.radiusN.value), maxAccuracy: Number(f.maxAcc.value), graceFactor: Number(f.grace.value), breakLimitMin: Number(f.brk.value), active: f.active.checked, updatedAt: serverTimestamp() };
    if (!nm) return (err.textContent = 'กรอกชื่อสาขา');
    if (!(v.radius >= 10 && v.radius <= 300)) return (err.textContent = 'รัศมีต้องอยู่ระหว่าง 10-300 เมตร');
    if (!(v.maxAccuracy >= 5 && v.maxAccuracy <= 500)) return (err.textContent = 'ค่าแม่นยำต้องอยู่ระหว่าง 5-500');
    if (!(v.graceFactor >= 1 && v.graceFactor <= 3)) return (err.textContent = 'ตัวคูณชายขอบต้องอยู่ระหว่าง 1-3');
    if (!(v.breakLimitMin >= 0 && v.breakLimitMin <= 600)) return (err.textContent = 'เวลาพักต้องอยู่ระหว่าง 0-600 นาที');
    if (f.lat.value !== '' || f.lng.value !== '') {
      const la = parseFloat(f.lat.value), ln = parseFloat(f.lng.value);
      if (!(isFinite(la) && isFinite(ln) && Math.abs(la) <= 90 && Math.abs(ln) <= 180)) return (err.textContent = 'พิกัดไม่ถูกต้อง');
      v.lat = la; v.lng = ln;
    }
    const up = {}; for (const [k, val] of Object.entries(v)) up[`branches/${bid}/${k}`] = val;
    const { updatedAt, ...afterV } = v;
    bestEffortAudit(up, 'branches/' + bid, D.branches && D.branches[bid] ? (({ updatedAt: _u, ...r }) => r)(D.branches[bid]) : null, afterV, 'edit_branch');
    try { await update(A(''), up); setDirty(false); } catch (e) { err.textContent = 'บันทึกไม่สำเร็จ: ' + (e.code || e.message); }
  });
  return { map, el, update: (bb) => { if (!dirty) fill(bb); } };
}

function renderBranches() {
  const root = $('#p-branches');
  if (!D.branches || !D.settings) return;
  const ids = Object.keys(D.branches).sort();
  const existing = [...mapCards.keys()].sort();
  if (!root.firstChild || ids.join() !== existing.join()) {
    destroyMaps(); clear(root);
    root.append(h('h3', null, 'ตั้งค่าสาขา'));
    if (!ids.length) {
      root.append(h('div', { class: 'card' }, h('p', null, 'ยังไม่มีสาขา'),
        h('button', { class: 'btn', onclick: seedBranches }, 'สร้าง 2 สาขาเริ่มต้น'),
        h('p', { class: 'muted' }, 'จะสร้างสาขาวงเวียนและสาขาแยกคลองยาง ยังไม่มีพิกัด ให้ไปยืนที่ร้านแล้วตั้งพิกัดทีหลัง')));
    }
    const holder = h('div'); root.append(holder);
    for (const bid of ids) { const c = buildBranchCard(bid, D.branches[bid]); mapCards.set(bid, c); holder.append(c.el); }
    const lg = h('input', { type: 'number', min: 0, max: 120, id: 'lateGrace', style: 'width:80px' });
    const rdI = h('input', { type: 'number', min: 7, max: 92, id: 'reviewDays', style: 'width:80px' });
    const cdI = h('input', { type: 'number', min: 1, max: 62, id: 'correctionDays', style: 'width:80px' });
    const lgMsg = h('span', { class: 'err', id: 'generalMsg' });
    root.append(h('div', { class: 'card', id: 'general' }, h('h3', null, 'ค่าทั่วไป'),
      h('div', { class: 'row' },
        h('label', null, 'นับว่ามาสายเมื่อเกินเวลากะ (นาที)', lg),
        h('label', null, 'คิวรอตรวจดูย้อนหลัง (วัน) 7-92', rdI),
        h('label', null, 'พนักงานขอแก้เวลาย้อนหลังได้ (วัน) 1-62', cdI),
        h('button', { class: 'btn', id: 'generalSave', onclick: async () => {
          const v1 = Number(lg.value), v2 = Number(rdI.value), v3 = Number(cdI.value);
          if (!(v1 >= 0 && v1 <= 120)) { lgMsg.textContent = 'เวลาสายต้องอยู่ระหว่าง 0-120'; return; }
          if (!(Number.isInteger(v2) && v2 >= 7 && v2 <= 92)) { lgMsg.textContent = 'ย้อนหลังตรวจต้องอยู่ระหว่าง 7-92 วัน'; return; }
          if (!(Number.isInteger(v3) && v3 >= 1 && v3 <= 62)) { lgMsg.textContent = 'ขอแก้ย้อนหลังต้องอยู่ระหว่าง 1-62 วัน'; return; }
          try { await update(A(''), { 'settings/lateGraceMin': v1, 'settings/reviewDays': v2, 'settings/correctionDays': v3 }); lgMsg.textContent = ''; toast('บันทึกแล้ว'); } catch (e) { lgMsg.textContent = 'ไม่สำเร็จ: ' + (e.code || e.message); }
        } }, 'บันทึก')), lgMsg));
    lg.value = D.settings.lateGraceMin ?? 5; rdI.value = D.settings.reviewDays ?? 31; cdI.value = D.settings.correctionDays ?? 7;
    // ----- ปฏิทินวันทำงาน (กันพนักงานเลือกวันทำงานเอง) -----
    const calChk = h('input', { type: 'checkbox', id: 'calEnforce' });
    calChk.addEventListener('change', () => toggleCalEnforce(calChk));
    root.append(h('div', { class: 'card', id: 'calcard' }, h('h3', null, 'ปฏิทินวันทำงาน (กันเลือกวันเอง)'),
      h('div', { id: 'calInfo' }),
      h('div', { id: 'calCovWarn', class: 'notice hidden' }),
      h('div', { class: 'muted' }, 'ปฏิทินคือเวลาเที่ยงคืนของแต่ละวันที่ rules ใช้ตรวจว่าพนักงานกดเข้างานตรงวันจริง ปิดไว้เป็นค่าเริ่มต้น เปิดได้เมื่อปฏิทินครอบคลุมอย่างน้อยวันนี้ + 365 วัน'),
      h('div', { class: 'row' },
        h('button', { class: 'btn blue', id: 'calGen', onclick: genCalendar }, 'สร้าง/ต่ออายุ 5 ปี'),
        h('label', { style: 'flex-direction:row;align-items:center;gap:6px' }, calChk, 'บังคับใช้ (พนักงานกดเข้างานได้เฉพาะวันที่ตรงกับเวลาจริง)'))));
    updateCalendarCard();
    setTimeout(() => mapCards.forEach((c) => c.map.invalidateSize()), 50);
  } else {
    for (const bid of ids) mapCards.get(bid).update(D.branches[bid]);
    for (const [id, val] of [['lateGrace', D.settings.lateGraceMin ?? 5], ['reviewDays', D.settings.reviewDays ?? 31], ['correctionDays', D.settings.correctionDays ?? 7]]) { const el = $('#' + id); if (el && document.activeElement !== el) el.value = val; }
    updateCalendarCard();
  }
}
async function seedBranches() {
  const base = { radius: 10, maxAccuracy: 30, graceFactor: 2, breakLimitMin: 60, active: true, updatedAt: serverTimestamp() };
  try {
    await update(A(''), {
      // หน้าร้าน 59/9 ถ.เทศบาลดำริ 3 สวรรคโลก ฝั่งวงเวียน (วัดจาก GPS ที่ร้านจริง ตรงกับหมุดร้านใน OSM)
      'branches/wongwian': { name: 'สาขาวงเวียน', ...base, lat: 17.318062, lng: 99.832187 },
      'branches/klongyang': { name: 'สาขาแยกคลองยาง', ...base },
      'settings/lateGraceMin': 5
    });
  } catch (e) { toast('สร้างไม่สำเร็จ: ' + (e.code || e.message)); }
}
</script>
</body>
