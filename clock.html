<script type="module">
// โหมดเดโม (?demo=1): ใช้ฐานข้อมูลจำลองในเครื่องแทน Firebase ดู demo.html ถ้าไม่มี ?demo=1 โค้ดเดโมไม่ถูกโหลดและใช้ Firebase SDK ตามเดิม
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const FBM = DEMO ? await import('./demo/firebase-demo.mjs') : null;
const [{ initializeApp }, { getAuth, setPersistence, indexedDBLocalPersistence, signInWithEmailAndPassword, createUserWithEmailAndPassword, deleteUser, signOut, onAuthStateChanged, connectAuthEmulator }, { getDatabase, ref, onValue, get, set, remove, update, push, serverTimestamp, connectDatabaseEmulator, query, orderByChild, equalTo }] = FBM ? [FBM, FBM, FBM] : await Promise.all([
  import('https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js'),
  import('https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js'),
  import('https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js')
]);

/* ====== ตั้งค่า Firebase (เจ้าของใส่เอง ดู README ข้อ 7) ====== */
const FIREBASE_CONFIG = {
  apiKey: 'PASTE_HERE',
  authDomain: 'PASTE_HERE',
  databaseURL: 'PASTE_HERE',
  projectId: 'PASTE_HERE',
  appId: 'PASTE_HERE'
};

const EMU = ['localhost', '127.0.0.1'].includes(location.hostname) && new URLSearchParams(location.search).get('emu') === '1';
// ค่าคงที่ของระบบบัญชีพนักงาน (ต้องตรงกันทุกตัวอักษรกับ clock-master.html และ database.rules.json) ดู docs/plan-auth-v2.md ข้อ 2.1
const STAFF_EMAIL_DOMAIN = '@staff.ngluckseng.invalid';
const USERNAME_RE = /^[a-z0-9_]{3,20}$/;
const PW_MIN = 6;
const normUser = (s) => String(s || '').trim().toLowerCase();
const staffEmail = (u) => normUser(u) + STAFF_EMAIL_DOMAIN;
const EMU_CFG = { apiKey: 'demo-key', projectId: 'demo-clock', databaseURL: 'https://demo-clock-default-rtdb.firebaseio.com' };
const CONFIG_MISSING = !EMU && !DEMO && Object.values(FIREBASE_CONFIG).some((v) => !v || v === 'PASTE_HERE');

const $root = document.getElementById('root');
if (DEMO) FBM.mountBanner('clock', () => { stopWatch(); liveFix = null; if (typeof initPermission === 'function') initPermission(); });
const $ = (s, r = document) => r.querySelector(s);
/** สร้าง element ด้วย textContent เท่านั้น (ห้ามใช้ innerHTML กับข้อมูลจาก DB) */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k.startsWith('.')) e[k.slice(1)] = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const clear = (n) => { while (n.firstChild) n.removeChild(n.firstChild); };

// ==== SHARED CORE v3 BEGIN — ต้องเหมือนกันทุกตัวอักษรใน clock.html และ clock-master.html (tests/core.test.mjs ตรวจ) ====
// วิธีแก้: แก้ใน clock-master.html ก่อน คัดลอกทั้งบล็อกไป clock.html แล้วรัน cd tests && npm run test:core
// ฟังก์ชันล้วน: ไม่อ้าง DOM / Firebase / Intl / ตัวแปรนอกบล็อก (ส่งค่าเข้ามาทาง ctx)
const MIN_MS = 60000, DAY_MS = 86400000, BKK_OFFSET_MS = 25200000;
const STALE_MS = 16 * 3600 * 1000;            // ค่าเดียวกับ 57600000 ใน database.rules.json
const TYPE_ORDER = { in: 0, break_start: 1, break_end: 2, out: 3 };
const HHMM_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
const isExcluded = (l) => !!l && (l.voided === true || l.review === 'rejected');
const bkkDateOf = (ms) => new Date(ms + BKK_OFFSET_MS).toISOString().slice(0, 10);
const hhmmOf = (ms) => new Date(ms + BKK_OFFSET_MS).toISOString().slice(11, 16);
const tsOf = (d, hhmm, plusDay) => Date.parse(d + 'T' + hhmm + ':00+07:00') + (plusDay ? DAY_MS : 0);
const addDaysKey = (d, n) => bkkDateOf(Date.parse(d + 'T12:00:00+07:00') + n * DAY_MS);
const floorMin = (ts) => Math.floor(ts / MIN_MS);
const logsToList = (obj) => Object.entries(obj || {}).filter(([, l]) => l && typeof l === 'object').map(([id, l]) => ({ ...l, id }))
  .sort((a, b) => (a.ts || 0) - (b.ts || 0) || (TYPE_ORDER[a.type] ?? 9) - (TYPE_ORDER[b.type] ?? 9));

/** summarize v3: segment เริ่มด้วย in; ไม่นับ voided/rejected; ค่าระดับบนเท่า v2 (flags นับเฉพาะที่ยังไม่ตรวจ) */
function summarize(logsObj) {
  const ev = logsToList(logsObj).filter((l) => typeof l.ts === 'number' && !isExcluded(l));
  const segments = [], flags = new Set(); let cur = null;
  for (const e of ev) {
    if (e.flag && !e.review) flags.add(e.flag);
    if (e.type === 'in') { cur = { n: segments.length + 1, inTs: e.ts, inLog: e, outTs: null, outLog: null, breakMs: 0, breaks: [], openBreak: null, openBreakAtOut: false, orphanOut: false }; segments.push(cur); continue; }
    if (!cur) continue;
    if (e.type === 'break_start') { if (cur.openBreak == null) cur.openBreak = e.ts; }
    else if (e.type === 'break_end') { if (cur.openBreak != null) { cur.breakMs += e.ts - cur.openBreak; cur.breaks.push([cur.openBreak, e.ts]); cur.openBreak = null; } }
    else if (e.type === 'out') { if (cur.outTs != null) { cur.orphanOut = true; continue; } if (cur.openBreak != null) cur.openBreakAtOut = true; cur.outTs = e.ts; cur.outLog = e; }
  }
  const last = segments[segments.length - 1] || null;
  const netMs = segments.filter((g) => g.outTs != null).reduce((a, g) => a + (g.outTs - g.inTs - g.breakMs), 0);
  return { ev, segments, flags, inTs: segments[0] ? segments[0].inTs : null, outTs: last ? last.outTs : null, breakMs: segments.reduce((a, g) => a + g.breakMs, 0), openBreak: last ? last.openBreak : null, netMs };
}

/**
 * สรุป 1 คน x 1 วันทำงาน (นาทีเต็มตามเวลาที่แสดง) ใช้ทุกหน้าจอ/รายงาน/CSV
 * ctx = { shiftStart, shiftEnd, graceMin, homeBranchId, breakLimitFor(branchId), state, now }
 */
function dayReport(d, logsObj, ctx) {
  const c = ctx || {};
  const sum = summarize(logsObj);
  const st = c.state || null;
  const now = typeof c.now === 'number' ? c.now : 0;
  const nSeg = sum.segments.length;
  const segs = sum.segments.map((g, i) => {
    const closed = g.outTs != null;
    const breakMin = g.breaks.reduce((a, b) => a + (floorMin(b[1]) - floorMin(b[0])), 0);
    let status = 'closed';
    if (!closed) {
      const live = i === nSeg - 1 && !!st && st.workDate === d && (st.status === 'working' || st.status === 'on_break') && typeof st.inAt === 'number' && now - st.inAt <= STALE_MS;
      status = live ? 'live' : 'missing';
    }
    return {
      n: g.n, inTs: g.inTs, outTs: g.outTs, inPlus: bkkDateOf(g.inTs) > d, outPlus: closed && bkkDateOf(g.outTs) > d,
      breakMin, netMin: closed ? floorMin(g.outTs) - floorMin(g.inTs) - breakMin : null, status,
      branchId: (g.inLog && g.inLog.branchId) || null, openBreakAtOut: g.openBreakAtOut, orphanOut: g.orphanOut
    };
  });
  const closedSegs = segs.filter((g) => g.status === 'closed');
  const netMin = closedSegs.reduce((a, g) => a + g.netMin, 0);
  const breakMin = closedSegs.reduce((a, g) => a + g.breakMin, 0);
  const breakMinAll = segs.reduce((a, g) => a + g.breakMin, 0);
  const missing = segs.some((g) => g.status === 'missing'), live = segs.some((g) => g.status === 'live');
  const openStatus = missing ? 'missing' : live ? 'live' : null;
  const firstInTs = nSeg ? segs[0].inTs : null;
  const lastOutTs = nSeg ? segs[nSeg - 1].outTs : null;
  // มาสาย: นับจากเวลาเข้ากะ (ไม่หักผ่อนผัน) สายเมื่อเกินผ่อนผัน
  const startOk = typeof c.shiftStart === 'string' && HHMM_RE.test(c.shiftStart);
  const graceMin = typeof c.graceMin === 'number' ? c.graceMin : 5;
  const lateRawMin = nSeg && startOk ? Math.floor((firstInTs - tsOf(d, c.shiftStart)) / MIN_MS) : null;
  const isLate = lateRawMin != null && lateRawMin > graceMin;
  // ออกก่อนเวลา: เฉพาะวันที่ครบ (ทุกกะมีเวลาออก) เทียบเวลาออกสุดท้ายกับเวลาเลิกกะ; เลิกกะน้อยกว่าเข้ากะ = ข้ามคืน (วันถัดไป)
  const endStr = c.shiftEnd == null || c.shiftEnd === '' ? (startOk && c.shiftStart >= '18:00' ? null : '18:00') : c.shiftEnd;   // ค่าเริ่มต้น 18:00 ใช้เมื่อเข้ากะก่อน 18:00 เท่านั้น
  const endOk = typeof endStr === 'string' && HHMM_RE.test(endStr);
  const complete = nSeg > 0 && openStatus === null && lastOutTs != null;
  const shiftEndTs = endOk ? tsOf(d, endStr, startOk && endStr < c.shiftStart) : null;
  const earlyRawMin = complete && endOk ? floorMin(shiftEndTs) - floorMin(lastOutTs) : null;
  const isEarly = earlyRawMin != null && earlyRawMin > 0;
  // สาขา + พักเกิน (ต่อวัน: พักรวมทุกกะ > เวลาพักของสาขา)
  const branchIds = [...new Set(sum.ev.map((l) => l.branchId).filter(Boolean))];
  const branchId = (nSeg && segs[0].branchId) || c.homeBranchId || null;
  const limRaw = typeof c.breakLimitFor === 'function' ? c.breakLimitFor(branchId) : null;
  const lim = limRaw == null || limRaw === '' ? NaN : Number(limRaw);
  const breakLimitMin = Number.isFinite(lim) ? lim : 60;
  const isOverBreak = breakMinAll > breakLimitMin;
  const all = Object.values(logsObj || {}).filter((l) => l && typeof l === 'object');
  const anomalies = [];
  if (segs.some((g) => g.openBreakAtOut)) anomalies.push('openBreakAtOut');
  if (segs.some((g) => g.orphanOut)) anomalies.push('orphanOut');   // out ซ้ำในกะที่ปิดแล้ว: ไม่เปิดกะใหม่ ไม่นับ
  if (segs.some((g) => g.netMin != null && g.netMin < 0)) anomalies.push('negativeNet');
  if (segs.some((g) => g.status === 'closed' && floorMin(g.outTs) - floorMin(g.inTs) > 960)) anomalies.push('longShift');
  return {
    d, sum, segs, worked: nSeg > 0, firstInTs, lastOutTs, netMin, breakMin, breakMinAll,
    closedCount: closedSegs.length, openStatus,
    lateRawMin, isLate, lateMin: isLate ? lateRawMin : 0,
    earlyRawMin, isEarly, earlyMin: isEarly ? earlyRawMin : (earlyRawMin != null ? 0 : null), shiftEndTs,
    breakLimitMin, isOverBreak, overBreakMin: isOverBreak ? breakMinAll - breakLimitMin : 0,
    branchId, branchIds, multiBranch: branchIds.length > 1,
    flagsPending: sum.flags,
    hasAdmin: sum.ev.some((l) => l.source === 'admin'), hasEdited: all.some((l) => l.origTs !== undefined), hasExcluded: all.some(isExcluded),
    anomalies
  };
}
// ==== SHARED CORE v3 END ====
function card(title, ...body) { return h('div', { class: 'card' }, title && h('h2', null, title), ...body); }

/* ====== หน้าที่ไม่ต้องใช้ Firebase ====== */
if (CONFIG_MISSING) {
  $root.append(card('ยังไม่ได้ตั้งค่า Firebase', h('div', null, 'ดูวิธีตั้งค่าในไฟล์ README')));
  throw new Error('FIREBASE_CONFIG ยังไม่ได้ตั้งค่า');
}
if ((!window.isSecureContext && !DEMO) || !('geolocation' in navigator)) {
  $root.append(card('เปิดแอปไม่ได้', h('div', null, 'เปิดจากลิงก์ที่ร้านส่งให้ (https) ด้วย Chrome หรือ Safari')));
  throw new Error('unsupported');
}

/* ====== Firebase ====== */
const app = initializeApp(DEMO ? { demo: true } : EMU ? EMU_CFG : FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getDatabase(app);
if (EMU) { connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true }); connectDatabaseEmulator(db, '127.0.0.1', 9000); }
const A = (p) => ref(db, 'attendance/' + p);
try { await setPersistence(auth, indexedDBLocalPersistence); } catch (_) { /* ใช้ค่าเริ่มต้น */ }
try { navigator.storage?.persist?.(); } catch (_) { }

if ('serviceWorker' in navigator && !EMU && !DEMO) navigator.serviceWorker.register('./sw.js').catch(() => { });

/* ====== เวลา ====== */
let serverOffset = 0;
const serverNow = () => Date.now() + serverOffset;
const timeF = new Intl.DateTimeFormat('th-TH', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const dateF = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' });
const fmtTime = (ms) => timeF.format(ms);
const bangkokDate = (ms) => dateF.format(ms);
const COOLDOWN_MS = 30000;
function fmtClock(ms) { const s = Math.max(0, Math.floor(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
function fmtMin(m) { m = Math.max(0, Math.round(m)); const hh = Math.floor(m / 60), mm = m % 60; return hh ? `${hh} ชม. ${String(mm).padStart(2, '0')} น.` : `${mm} นาที`; }
const fmtDist = (m) => (m >= 1000 ? `${(m / 1000).toFixed(1)} กม.` : `${Math.round(m)} ม.`);
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

/* ====== ข้อมูลสด (Auth v2: บัญชี = accounts/{uid}, เครื่อง = กุญแจใน localStorage) ====== */
const D = { acct: undefined, staff: undefined, info: undefined, branches: null, settings: null, state: undefined, logs: null, corr: null };

/* ====== Geofence ====== */
function haversine(la1, ln1, la2, ln2) {
  const R = 6371008.8, r = Math.PI / 180;
  const dLa = (la2 - la1) * r, dLn = (ln2 - ln1) * r;
  const a = Math.sin(dLa / 2) ** 2 + Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin(dLn / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}
/** เลือกสาขาที่ใกล้สุดแล้วตัดสิน ok / borderline / refuse */
function evaluate(lat, lng, acc) {
  let best = null;
  for (const [bid, b] of Object.entries(D.branches || {})) {
    if (!b || b.active === false || typeof b.lat !== 'number' || typeof b.lng !== 'number') continue;
    const d = haversine(lat, lng, b.lat, b.lng);
    if (!best || d < best.d) best = { bid, b, d };
  }
  if (!best) return { verdict: 'nobranch' };
  const R = Number(best.b.radius) || 10, M = Number(best.b.maxAccuracy) || 30, g = Number(best.b.graceFactor) || 2;
  const d = best.d, a = acc;
  let verdict, bReason = null;
  if (d <= R && a <= M) verdict = 'ok';
  else if ((d > R && d <= R * g && a <= M) || (d <= R && a > M && a <= 2 * M)) { verdict = 'borderline'; bReason = d > R ? 'dist' : 'acc'; }
  else verdict = 'refuse';
  return { verdict, bReason, bid: best.bid, branch: best.b, d, a, R, M, tooWeak: a > 2 * M, noPrecise: a > 1000 };
}
function refuseText(ev) {
  if (ev.noPrecise) return 'มือถือปิด "ตำแหน่งที่แม่นยำ" อยู่ — เปิดในการตั้งค่าตำแหน่งของเว็บนี้';
  if (ev.tooWeak) return 'สัญญาณตำแหน่งยังไม่ชัด — ออกไปใกล้ประตูหรือที่โล่ง แล้วกดใหม่';
  return `อยู่ห่างร้าน ${fmtDist(ev.d)} — เดินเข้าใกล้ร้านอีกนิด`;
}
function geoErr(e) {
  if (e && e.code === 1) return { title: 'ยังไม่ได้อนุญาตให้ใช้ตำแหน่ง', text: isIOS
    ? 'iPhone: การตั้งค่า > ความเป็นส่วนตัวฯ > บริการหาตำแหน่งที่ตั้ง > Safari/เว็บไซต์ > ขณะใช้งานแอป'
    : 'Android: แตะรูปแม่กุญแจข้างลิงก์ > สิทธิ์ > ตำแหน่ง > อนุญาต' };
  if (e && e.code === 2) return { title: 'หาตำแหน่งไม่ได้', text: 'เปิด "ตำแหน่ง" ของมือถือ แล้วกดใหม่' };
  return { title: 'หาตำแหน่งนานเกินไป', text: 'ออกไปใกล้ประตูหรือที่โล่ง แล้วกดใหม่' };
}
const GEO = DEMO ? FBM.demoGeo : navigator.geolocation;      // เดโม: จำลองตำแหน่งได้ (เลือกที่แถบด้านบน)
const gp = (opts) => new Promise((res, rej) => GEO.getCurrentPosition(res, rej, opts));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/** เก็บตัวอย่างตำแหน่งสูงสุด 12 วิ เลือกค่าที่ accuracy ดีสุด */
async function sampleFix() {
  const t0 = Date.now(), samples = []; let lastErr = null;
  for (;;) {
    const el = Date.now() - t0;
    if (samples.length >= 3 || el >= 12000 || (el >= 6000 && samples.length >= 1)) break;
    try {
      const p = await gp({ enableHighAccuracy: true, timeout: Math.min(10000, 12000 - el), maximumAge: 0 });
      samples.push({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy });
    } catch (e) { lastErr = e; if (e.code === 1) break; await sleep(500); }
  }
  for (const f of fixLog) if (f.t >= t0) samples.push(f);
  if (!samples.length) throw lastErr || { code: 3 };
  return samples.reduce((a, b) => (b.acc < a.acc ? b : a));
}

/* ----- แถบระยะสด ----- */
function startWatch() {
  if (watchId != null || !GEO) return;
  watchId = GEO.watchPosition((p) => {
    liveFix = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
    fixLog.push(liveFix); if (fixLog.length > 20) fixLog.shift();
    updateDynamic();
  }, () => { }, { enableHighAccuracy: true, maximumAge: 5000 });
}
function stopWatch() { if (watchId != null) { GEO.clearWatch(watchId); watchId = null; } }
async function initPermission() {
  if (DEMO && FBM.demoGpsMode() !== 'real') { permState = 'granted'; startWatch(); render(); return; }
  try {
    if (!navigator.permissions?.query) { permState = 'prompt'; return; }
    const st = await navigator.permissions.query({ name: 'geolocation' });
    const apply = () => { permState = st.state; if (permState === 'granted') startWatch(); else stopWatch(); render(); };
    st.onchange = apply; apply();
  } catch (_) { permState = 'prompt'; render(); }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopWatch(); else if (permState === 'granted') startWatch();
});
async function askLocation() {
  try { await gp({ enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }); permState = 'granted'; startWatch(); }
  catch (e) { if (e.code === 1) permState = 'denied'; }
  render();
}

/* ====== ลงเวลา (กดปุ่ม) ====== */
async function act(type) {
  if (busy || !me) return;
  refusal = null; cooldownShown = false;
  if (!connected) { render(); return; }
  const st = D.state;
  if (st && typeof st.since === 'number' && serverNow() - st.since < COOLDOWN_MS) { cooldownShown = true; render(); return; }
  const sset = D.settings || {};
  if (type === 'in' && sset.calendarEnforced === true && sset.calendarLast && bangkokDate(serverNow()) > sset.calendarLast) {
    refusal = { title: 'ระบบปฏิทินหมดอายุ', text: 'แจ้งเจ้าของร้านให้ต่ออายุปฏิทิน' }; render(); return;
  }
  if (type === 'out' && !(await confirmOut())) return;
  busy = 'locating'; render();
  let fix;
  try { fix = await sampleFix(); }
  catch (e) { busy = null; const g = geoErr(e); refusal = { ...g }; render(); return; }
  const ev = evaluate(fix.lat, fix.lng, fix.acc);
  if (ev.verdict === 'nobranch') { busy = null; refusal = { title: 'ร้านยังไม่ได้ตั้งตำแหน่ง', text: 'แจ้งเจ้าของร้าน' }; render(); return; }
  if (ev.verdict === 'refuse') { busy = null; refusal = { title: refuseTitle(ev), text: refuseText(ev) }; render(); return; }
  await save(type, fix, ev);
}
const refuseTitle = (ev) => (ev.noPrecise ? 'ตำแหน่งไม่แม่นยำ' : ev.tooWeak ? 'สัญญาณตำแหน่งไม่ชัด' : 'ยังอยู่นอกร้าน');

async function save(type, fix, ev) {
  const st = D.state, sid = me.sid, now = serverNow();
  const lat = Number(fix.lat.toFixed(6)), lng = Number(fix.lng.toFixed(6));
  const acc = Math.round(fix.acc), dist = Math.floor(ev.d);   // ปัดลง ไม่ให้เกินเกณฑ์ที่ rules ตรวจ (radius x graceFactor)
  if (type !== 'in' && typeof st?.inAt !== 'number') { busy = null; refusal = { title: 'ข้อมูลกะไม่สมบูรณ์', text: 'แจ้งเจ้าของร้านให้ตรวจสอบ' }; render(); return; }
  // ธงน่าสงสัย (คำนวณฝั่งเครื่อง ใช้ช่วยคัดให้เจ้าของดูเท่านั้น)
  const sus = [];
  if (fix.acc < 3) sus.push('acc');
  if (st && typeof st.lastLat === 'number' && st.lastLat.toFixed(6) === lat.toFixed(6) && st.lastLng.toFixed(6) === lng.toFixed(6)) sus.push('same');
  if (st && st.lastBranchId && st.lastBranchId !== ev.bid && typeof st.since === 'number' && now - st.since < 10 * 60000) sus.push('hop');
  let flag = null, flagReason = null;
  if (sus.length) { flag = 'suspect'; flagReason = sus.join(','); }
  else if (ev.verdict === 'borderline') { flag = 'borderline'; flagReason = ev.bReason; }

  const d = type === 'in' ? bangkokDate(now) : st.workDate;
  const lid = push(A(`logs/${d}/${sid}`)).key;
  const logPath = `logs/${d}/${sid}/${lid}`;
  const log = { type, ts: serverTimestamp(), lat, lng, accuracy: acc, distance: dist, branchId: ev.bid, uid: user.uid, source: 'app', clientTs: Date.now() };
  if (flag) { log.flag = flag; log.flagReason = flagReason; }
  const stateNew = { status: NEXT[type], workDate: d, since: serverTimestamp(), inAt: type === 'in' ? serverTimestamp() : st.inAt, lastLogId: lid, lastLat: lat, lastLng: lng, lastBranchId: ev.bid };
  busy = 'saving'; render();
  const slow = setTimeout(() => { if (busy === 'saving') { busy = 'slow'; render(); } }, 8000);
  try {
    await update(A(''), { [logPath]: log, [`state/${sid}`]: stateNew, ...proofOf(sid) });   // proof = กุญแจเครื่องที่เจ้าของอนุมัติ (rules ตรวจ)
    clearTimeout(slow);
    let ts = serverNow();
    try { const snap = await Promise.race([get(A(logPath)), sleep(1000).then(() => null)]); if (snap && snap.val()?.ts) ts = snap.val().ts; } catch (_) { }
    busy = null; render();
    showSuccess(type, ts);
  } catch (e) {
    clearTimeout(slow);
    busy = null;
    refusal = { title: 'บันทึกไม่สำเร็จ', text: 'ลองใหม่อีกครั้ง ถ้ายังไม่ได้ให้แจ้งเจ้าของ' };
    render();
  }
}
function showSuccess(type, ts) {
  navigator.vibrate?.(200);
  const tick = h('div', { class: 'tick' });
  tick.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>'; // ข้อความคงที่ ไม่ใช่ข้อมูลจาก DB
  const ov = h('div', { id: 'ov' }, tick, h('div', { class: 'msg' }, `${LABEL[type]} ${fmtTime(ts)}`));
  document.body.append(ov);
  setTimeout(() => ov.remove(), 2000);
}
function confirmOut() {
  return new Promise((res) => {
    const close = (v) => { box.remove(); res(v); };
    const box = h('div', { id: 'cf' }, h('div', { class: 'box' },
      h('div', { style: 'font-size:26px;font-weight:800;margin-bottom:6px' }, 'ออกงานตอนนี้ใช่ไหม'),
      h('button', { class: 'btn red', onclick: () => close(true) }, 'ใช่ ออกงาน'),
      h('button', { class: 'btn gray', onclick: () => close(false) }, 'ยกเลิก')));
    document.body.append(box);
  });
}

/** เขียนคำขอของ uid นี้ (สมัคร/ขอใช้เครื่อง) พร้อมกุญแจเครื่องใหม่ที่ยังไม่ใช้งานจนกว่าเจ้าของอนุมัติ */
async function writeRequest(kind, extra) {

  if (D.info) { try { await remove(A('deviceRequests/' + cu.uid)); } catch (_) { } }

}

function histSummary(d, logsObj) {

  const pend = myPend();
  $root.append(card('ส่งคำขอแล้ว รอเจ้าของอนุมัติ', h('div', null, 'เมื่ออนุมัติแล้วหน้านี้จะเปลี่ยนเอง'), D.info && pend && D.info.did !== pend.did ? h('div', { class: 'small', style: 'margin-top:8px' }, 'คำขอนี้ส่งจากมือถือเครื่องอื่น') : null, af.err && h('div', { class: 'err' }, af.err)));
  if (D.info && (!pend || D.info.did !== pend.did)) $root.append(h('button', { class: 'btn blue', id: 'resendHere', disabled: af.busy, onclick: () => { af.nick = D.info.nickname || ''; sendNeedRequestAfterReject(); } }, 'ส่งจากเครื่องนี้แทน'));
  $root.append(logoutBtn());
}
function buildDeviceAsk(replaced) {
  const has = acct && acct.s.deviceId;
  $root.append(h('div', { class: 'hdr' }, h('span', null, 'สวัสดี ' + (acct ? acct.s.nickname : ''))));
  $root.append(card(replaced ? 'มีการอนุมัติมือถือเครื่องอื่นแทนเครื่องนี้แล้ว' : 'มือถือเครื่องนี้ยังไม่ได้ผูกกับบัญชีของคุณ',
    h('div', null, replaced ? 'ถ้าต้องการใช้เครื่องนี้ ให้ขอใช้เครื่องนี้แทน' : 'ต้องให้เจ้าของอนุมัติเครื่องนี้ก่อนจึงจะลงเวลาได้'),
    has && !replaced ? h('div', { class: 'small', style: 'margin-top:8px' }, 'ถ้าขอใช้เครื่องนี้ เครื่องเดิมจะลงเวลาไม่ได้') : null,
    af.err && h('div', { class: 'err' }, af.err)));
  $root.append(h('button', { class: 'btn', id: 'reqDevice', disabled: af.busy, onclick: sendDeviceRequest }, replaced ? 'ขอใช้เครื่องนี้แทน' : 'ขอใช้เครื่องนี้'), logoutBtn());
}

function buildMain() {
  const mode = mainMode();
  ui.hdrName = h('span');
  ui.branch = h('span', { class: 'br' });
  $root.append(h('div', { class: 'hdr' }, ui.hdrName, ui.branch));
  ui.offline = h('div', { class: 'bar y' }, 'ไม่มีอินเทอร์เน็ต — ต่อเน็ตแล้วกดใหม่');
  ui.offline.classList.toggle('hidden', connected);
  $root.append(ui.offline);
  ui.devWarn = h('div', { class: 'bar y hidden', id: 'devWarn' }, 'มีคนขอใช้บัญชีของคุณบนมือถือเครื่องอื่น — ถ้าไม่ใช่คุณ แจ้งเจ้าของทันที');
  $root.append(ui.devWarn);
  ui.live = h('div', { class: 'bar' });
  $root.append(ui.live);
  if (permState === 'prompt' || permState === 'unknown') {
    $root.append(card(null, h('div', null, 'ร้านใช้ตำแหน่งเฉพาะตอนกดปุ่ม เพื่อยืนยันว่าอยู่ที่ร้าน'), h('button', { class: 'btn blue', onclick: askLocation }, 'อนุญาตตำแหน่ง')));
  } else if (permState === 'denied') {
    const g = geoErr({ code: 1 });
    $root.append(card(g.title, h('div', null, g.text), h('button', { class: 'btn blue', onclick: askLocation }, 'ลองใหม่')));
  }
  ui.note = h('div');
  $root.append(ui.note);

  const next = { OFF: 'in', STALE: 'in', WORKING: 'break_start', ON_BREAK: 'break_end' }[mode];
  ui.main = h('button', { class: 'big', onclick: () => next && act(next) });
  ui.mainLabel = h('span'); ui.mainSub = h('small');
  ui.timer = h('span', { class: 'timer' });
  ui.main.append(ui.mainLabel);
  if (mode === 'ON_BREAK') ui.main.append(ui.timer);
  ui.main.append(ui.mainSub);
  $root.append(ui.main);
  if (mode === 'WORKING') $root.append(h('button', { class: 'sec', onclick: () => act('out') }, 'ออกงาน'));
  ui.tl = h('div', { class: 'tl' });
  $root.append(ui.tl);
  ui.corrBox = h('div');
  $root.append(ui.corrBox);
}

function updateDynamic() {
  if (currentView() !== 'MAIN' || !ui.main) return;
  const mode = mainMode(), now = serverNow(), st = D.state;
  ui.hdrName.textContent = 'สวัสดี ' + me.s.nickname;
  // สาขา + แถบระยะสด
  const fresh = liveFix && Date.now() - liveFix.t <= 20000;
  let ev = fresh ? evaluate(liveFix.lat, liveFix.lng, liveFix.acc) : null;
  const homeBranch = (D.branches || {})[me.s.branchId];
  ui.branch.textContent = (ev && ev.branch ? ev.branch.name : homeBranch && homeBranch.name) || '';
  let cls = 'bar', txt;
  if (permState !== 'granted') txt = permState === 'denied' ? 'ยังไม่ได้อนุญาตตำแหน่ง' : 'ยังไม่ได้อนุญาตตำแหน่ง';
  else if (!ev) txt = 'กำลังหาตำแหน่ง...';
  else if (ev.verdict === 'nobranch') txt = 'ร้านยังไม่ได้ตั้งตำแหน่ง — แจ้งเจ้าของ';
  else if (ev.verdict === 'ok') { cls += ' g'; txt = `● อยู่ในร้าน (ห่าง ${fmtDist(ev.d)})`; }
  else if (ev.verdict === 'borderline') { cls += ' o'; txt = `● ใกล้ขอบเขตร้าน (ห่าง ${fmtDist(ev.d)})`; }
  else if (ev.tooWeak || ev.noPrecise) { txt = 'สัญญาณตำแหน่งยังไม่ชัด'; }
  else { cls += ' r'; txt = `● อยู่นอกร้าน (ห่าง ${fmtDist(ev.d)})`; }
  ui.live.className = cls; ui.live.textContent = txt;

  ui.offline.classList.toggle('hidden', connected);
  { const dv = myDev(); ui.devWarn.classList.toggle('hidden', !(D.info && D.info.kind === 'device' && D.info.status === 'pending' && dv && D.info.did !== dv.did)); }

  // ปุ่มหลัก
  const brkMs = (() => { const s = summarize(D.logs); return s.breakMs + (s.openBreak != null ? now - s.openBreak : 0); })();
  const sum = summarize(D.logs);
  const rep = dayReport(timelineDate(), D.logs, { shiftStart: me.s.shiftStart, shiftEnd: me.s.shiftEnd, graceMin: Number((D.settings || {}).lateGraceMin ?? 5), homeBranchId: me.s.branchId, breakLimitFor: (b) => ((D.branches || {})[b] || {}).breakLimitMin, state: st, now });
  const nextType = { OFF: 'in', STALE: 'in', WORKING: 'break_start', ON_BREAK: 'break_end' }[mode];
  const disabled = !connected || !!busy || mode === 'DONE';
  ui.main.disabled = disabled;
  ui.main.className = 'big ' + (disabled && !busy ? 'c-gray' : mode === 'DONE' ? 'c-gray' : BTN_CLS[nextType] || 'c-gray');
  if (busy === 'locating') { ui.mainLabel.textContent = 'กำลังหาตำแหน่ง...'; ui.mainSub.textContent = 'รอสักครู่'; ui.main.className = 'big c-gray'; }
  else if (busy === 'saving') { ui.mainLabel.textContent = 'กำลังบันทึก...'; ui.mainSub.textContent = ''; ui.main.className = 'big c-gray'; }
  else if (busy === 'slow') { ui.mainLabel.textContent = 'เน็ตช้า กำลังส่ง...'; ui.mainSub.textContent = 'อย่าปิดแอป'; ui.main.className = 'big c-gray'; }
  else if (mode === 'DONE') {
    ui.mainLabel.textContent = 'ออกงานแล้ว';
    ui.mainSub.textContent = rep.closedCount ? `ทำงาน ${fmtMin(rep.netMin)} · พัก ${fmtMin(rep.breakMin)}` : '';
  } else if (mode === 'ON_BREAK') {
    ui.mainLabel.textContent = LABEL.break_end;
    ui.timer.textContent = fmtClock(sum.openBreak != null ? now - sum.openBreak : 0);
    const lim = Number(((D.branches || {})[st.lastBranchId] || homeBranch || {}).breakLimitMin ?? 60) * 60000;
    ui.timer.classList.toggle('over', brkMs > lim);
    ui.mainSub.textContent = `พักรวมวันนี้ ${fmtMin(brkMs / 60000)}`;
    ui.main.style.background = brkMs > lim ? '#ea580c' : '';
  } else { ui.mainLabel.textContent = LABEL[nextType]; ui.mainSub.textContent = ''; }

  // ข้อความแจ้ง
  clear(ui.note);
  if (mode === 'STALE') ui.note.append(card('กะก่อนยังไม่ได้กดออกงาน', h('div', null, 'แจ้งเวลาออกของกะก่อน หรือกดเข้างานของวันนี้ได้เลย'),
    h('button', { class: 'btn blue', onclick: () => openCorrNew({ d: st.workDate, type: 'out' }) }, 'แจ้งเวลาออกของกะก่อน')));
  if (cooldownShown) {
    const left = st && typeof st.since === 'number' ? Math.ceil((COOLDOWN_MS - (now - st.since)) / 1000) : 0;
    if (left > 0) ui.note.append(card('เพิ่งกดไปเมื่อสักครู่', h('div', null, `รออีก ${left} วินาที`)));
    else { cooldownShown = false; }
  }
  if (refusal) ui.note.append(card(refusal.title, h('div', null, refusal.text), h('button', { class: 'btn gray', onclick: () => { refusal = null; render(); } }, 'ปิด')));

  // ไทม์ไลน์
  const ev2 = sum.ev;
  const lab = timelineDate() === bangkokDate(now) ? 'วันนี้' : 'กะวันที่ ' + timelineDate();
  ui.tl.textContent = ev2.length ? `${lab}: ` + ev2.map((e) => `${TL[e.type]} ${fmtTime(e.ts)}${e.source === 'admin' ? ' (เจ้าของบันทึก)' : ''}`).join(' · ') : `${lab}: ยังไม่มีรายการ`;

  // แจ้งแก้เวลา: ลิงก์ + สถานะคำขอ
  clear(ui.corrBox);
  const unseen = corrUnseen(), pend = corrPendingCount();
  ui.corrBox.append(h('div', { style: 'display:flex;gap:8px' },
    h('button', { class: 'btn link', id: 'histLink', style: 'flex:1', onclick: histOpen }, 'ประวัติ'),
    h('button', { class: 'btn link', id: 'corrLink', style: 'flex:1', onclick: openCorrList }, 'แจ้งแก้เวลา', unseen ? h('span', { class: 'dot' }) : null)));
  if (unseen) ui.corrBox.append(h('div', { class: 'small', style: 'text-align:center', onclick: openCorrList }, 'เจ้าของตอบคำขอแล้ว — แตะเพื่อดู'));
  if (pend) ui.corrBox.append(h('div', { class: 'small', style: 'text-align:center' }, `คำขอแก้เวลา รออนุมัติ ${pend} รายการ`));
}

/* ====== เริ่มทำงาน ====== */
setInterval(() => {
  if (currentView() === 'MAIN') {
    // ข้ามวันหรือครบ 16 ชม. แล้วโหมดอาจเปลี่ยน
    syncLogs(); render();
  }
}, 1000);
setInterval(() => { if (currentView() === 'MAIN') updateDynamic(); }, 5000);

onAuthStateChanged(auth, async (u) => {
  authReady = true;
  if (!u) { teardownUser(); render(); return; }
  if (user && user.uid === u.uid) return;
  teardownUser();
  user = u;
  if (isStaffUser(u)) { attachUser(); initPermission(); }
  render();
});

render();
</script>
</body>
</html>
